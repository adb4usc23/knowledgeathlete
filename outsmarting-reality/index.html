<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outsmarting Reality — Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0c; --bg-2:#101015; --panel:#15151c; --panel-2:#1b1b24;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --ink:#f4f1 ea; --ink:#f4f1ea; --muted:#9b97a3; --faint:#65626d;
  --gold:#c9a86a; --gold-2:#e7cf9a; --gold-soft:rgba(201,168,106,.14);
  --accent:#b8a4ff; --green:#7fd1a8; --red:#e08b7d; --blue:#8fb4e3;
  --r:16px; --r-sm:10px; --shadow:0 24px 60px -20px rgba(0,0,0,.7);
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(900px 600px at 12% -10%, rgba(201,168,106,.10), transparent 60%),
    radial-gradient(800px 700px at 110% 10%, rgba(184,164,255,.07), transparent 55%),
    radial-gradient(700px 700px at 50% 120%, rgba(143,180,227,.06), transparent 60%);
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.16)}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}

/* LAYOUT */
.app{position:relative;z-index:1;display:grid;grid-template-columns:264px 1fr;height:100vh}
.sidebar{
  border-right:1px solid var(--line); background:rgba(10,10,12,.6);
  backdrop-filter:blur(14px); display:flex;flex-direction:column; padding:22px 16px; gap:6px; overflow-y:auto;
}
.brand{padding:6px 10px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand .mark{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.2px;line-height:1.15}
.brand .mark em{font-style:italic;color:var(--gold-2)}
.brand .sub{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-top:7px}
.nav-group{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:14px 12px 6px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm);
  color:var(--muted);font-weight:500;font-size:13.5px;border:1px solid transparent;transition:.18s;white-space:nowrap
}
.nav-item:hover{background:var(--panel);color:var(--ink)}
.nav-item.active{background:var(--gold-soft);color:var(--gold-2);border-color:rgba(201,168,106,.22)}
.nav-item .ico{width:17px;height:17px;flex:0 0 auto;opacity:.9}
.nav-item .badge{margin-left:auto;font-size:10px;background:var(--panel-2);color:var(--muted);padding:1px 7px;border-radius:20px}
.sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);line-height:1.5}

.main{overflow-y:auto;height:100vh;position:relative}
.wrap{max-width:980px;margin:0 auto;padding:46px 48px 120px}
.view{animation:rise .5s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* TYPE */
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:0 0 14px}
h1.display{font-family:var(--serif);font-weight:600;font-size:42px;line-height:1.08;letter-spacing:-.01em;margin:0 0 12px}
h1.display em{font-style:italic;color:var(--gold-2)}
.lead{font-size:17px;color:var(--muted);max-width:62ch;margin:0 0 8px}
h2.sec{font-family:var(--serif);font-weight:600;font-size:24px;margin:42px 0 16px;letter-spacing:-.01em}
.serif{font-family:var(--serif)}

/* CARDS */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.card.glass{background:linear-gradient(180deg,rgba(27,27,36,.7),rgba(21,21,28,.55))}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:880px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* HERO DASHBOARD */
.hero{
  position:relative;border-radius:22px;overflow:hidden;padding:38px 36px;
  background:linear-gradient(135deg,rgba(28,24,18,.9),rgba(16,16,21,.9));
  border:1px solid var(--line-2);box-shadow:var(--shadow)
}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(600px 300px at 100% 0,rgba(201,168,106,.18),transparent 60%);pointer-events:none}
.hero .greet{font-size:13px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.hero h2{font-family:var(--serif);font-size:32px;font-weight:600;margin:10px 0 6px;letter-spacing:-.01em;max-width:24ch}
.hero p{color:var(--muted);max-width:54ch;margin:0}

/* STATS */
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;position:relative;overflow:hidden}
.stat .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
.stat .v{font-family:var(--serif);font-size:30px;font-weight:600;margin-top:6px;line-height:1}
.stat .v small{font-size:14px;color:var(--muted);font-family:var(--sans);font-weight:500}
.stat .meta{font-size:12px;color:var(--muted);margin-top:4px}
.ring{--p:0;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:grid;place-items:center;position:absolute;top:16px;right:16px}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel)}
.ring span{position:relative;font-size:11px;font-weight:600;color:var(--gold-2)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:11px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);font-weight:600;font-size:13.5px;transition:.18s}
.btn:hover{border-color:var(--gold);color:var(--gold-2);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#1a140a;border:none}
.btn.primary:hover{filter:brightness(1.06);color:#1a140a}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 13px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* PILLS / CHIPS */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted)}
.chip.gold{background:var(--gold-soft);border-color:rgba(201,168,106,.25);color:var(--gold-2)}
.chip.green{background:rgba(127,209,168,.12);border-color:rgba(127,209,168,.25);color:var(--green)}

/* JOURNEY */
.level-card{position:relative;display:flex;gap:20px;padding:24px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);transition:.2s;cursor:pointer;overflow:hidden}
.level-card:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow)}
.level-card.locked{opacity:.5;cursor:default}
.level-card.locked:hover{transform:none;box-shadow:none;border-color:var(--line)}
.level-num{font-family:var(--serif);font-size:40px;font-weight:600;color:var(--gold);line-height:1;width:60px;flex:0 0 auto;opacity:.85}
.level-card h3{font-family:var(--serif);font-size:21px;font-weight:600;margin:0 0 5px}
.level-card .desc{color:var(--muted);font-size:14px;margin:0 0 12px;max-width:54ch}
.lbar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;max-width:280px}
.lbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:6px;transition:width .6s}
.lesson-row{display:flex;align-items:center;gap:14px;padding:15px 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:10px;transition:.16s;cursor:pointer}
.lesson-row:hover{border-color:var(--line-2);background:var(--panel-2)}
.lesson-row .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);flex:0 0 auto;display:grid;place-items:center;font-size:12px}
.lesson-row.done .dot{background:var(--gold);border-color:var(--gold);color:#1a140a}
.lesson-row .t{font-weight:600;font-size:14.5px}
.lesson-row .m{font-size:12.5px;color:var(--faint)}
.lesson-row .arrow{margin-left:auto;color:var(--faint)}

/* LESSON VIEW */
.lesson-hero{border-radius:20px;padding:34px;background:linear-gradient(135deg,rgba(26,24,20,.85),rgba(15,15,20,.9));border:1px solid var(--line-2);margin-bottom:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px}
.callout{border-left:3px solid var(--gold);background:var(--gold-soft);padding:16px 20px;border-radius:0 12px 12px 0;margin:18px 0}
.callout .lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px}
.quote{font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.45;color:var(--gold-2);border:none;margin:24px 0;padding:0 0 0 22px;border-left:2px solid rgba(201,168,106,.4)}
.quote cite{display:block;font-style:normal;font-family:var(--sans);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:10px}
.model{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.model .n{font-family:var(--serif);font-size:22px;color:var(--gold);flex:0 0 auto}
.applist li{margin-bottom:8px;color:var(--muted)}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0}
.flow .node{padding:8px 13px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line-2);font-size:12.5px;font-weight:600}
.flow .node.gold{background:var(--gold-soft);border-color:rgba(201,168,106,.3);color:var(--gold-2)}
.flow .ar{color:var(--gold);font-weight:700}

/* FORMS */
label.fld{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:16px 0 7px;letter-spacing:.01em}
label.fld .hint{color:var(--faint);font-weight:400;font-size:12px}
.input,textarea.input,select.input{
  width:100%;background:var(--bg-2);border:1px solid var(--line-2);border-radius:11px;
  padding:12px 14px;color:var(--ink);font-size:14px;transition:.16s;resize:vertical
}
.input:focus,textarea.input:focus,select.input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
textarea.input{min-height:84px;line-height:1.55}
.range{width:100%;-webkit-appearance:none;height:6px;border-radius:6px;background:rgba(255,255,255,.1);outline:none}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--gold-2);cursor:pointer;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--gold)}

/* TOOLS GALLERY */
.tool-card{position:relative;padding:24px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);cursor:pointer;transition:.2s;overflow:hidden;min-height:172px;display:flex;flex-direction:column}
.tool-card:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:var(--shadow)}
.tool-card .ti{font-size:24px;margin-bottom:14px}
.tool-card h3{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 7px}
.tool-card p{color:var(--muted);font-size:13.5px;margin:0 0 auto}
.tool-card .open{margin-top:14px;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.04em}
.tool-card::after{content:"";position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,106,.12),transparent 70%)}

/* STEPPER */
.steps{display:flex;gap:6px;margin:0 0 22px}
.steps .s{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.1)}
.steps .s.on{background:var(--gold)}
.steps .s.done{background:rgba(201,168,106,.5)}

/* MEDITATION / TIMER */
.orb{width:160px;height:160px;border-radius:50%;margin:10px auto;position:relative;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,rgba(201,168,106,.35),rgba(201,168,106,.05));
  box-shadow:0 0 60px rgba(201,168,106,.18)}
.orb.breathe{animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.8);box-shadow:0 0 40px rgba(201,168,106,.12)}50%{transform:scale(1.08);box-shadow:0 0 80px rgba(201,168,106,.28)}}
.orb .tt{font-family:var(--serif);font-size:30px;color:var(--gold-2);font-weight:600}
.bigtimer{font-family:var(--serif);font-size:54px;font-weight:600;text-align:center;letter-spacing:.02em}

/* LIST ITEMS (ledger/journal) */
.li{display:flex;align-items:flex-start;gap:13px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:10px}
.li .check{width:22px;height:22px;border-radius:6px;border:2px solid var(--line-2);flex:0 0 auto;display:grid;place-items:center;cursor:pointer;font-size:12px;margin-top:1px}
.li .check.on{background:var(--green);border-color:var(--green);color:#0a1a12}
.li .check.no{background:var(--red);border-color:var(--red);color:#1a0a08}
.li .body{flex:1;min-width:0}
.li .body .x{font-weight:600;font-size:14px}
.li .body .y{font-size:12px;color:var(--faint);margin-top:2px}
.li .del{color:var(--faint);font-size:18px;line-height:1;background:none;border:none;padding:4px}
.li .del:hover{color:var(--red)}

.empty{text-align:center;padding:40px 20px;color:var(--faint)}
.empty .ico{font-size:34px;opacity:.5;margin-bottom:10px}

/* LIBRARY */
.lib-card{padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--panel);transition:.18s}
.lib-card:hover{border-color:var(--line-2)}
.lib-card .cat{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.lib-card h4{font-family:var(--serif);font-size:17px;margin:8px 0 6px;font-weight:600}
.lib-card p{color:var(--muted);font-size:13px;margin:0}
.search{width:100%;background:var(--bg-2);border:1px solid var(--line-2);border-radius:12px;padding:13px 16px 13px 42px;color:var(--ink);font-size:14px}
.searchwrap{position:relative;margin-bottom:8px}
.searchwrap .si{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--faint)}

/* CHALLENGE */
.dots{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}
.dots .d{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.07);border:1px solid var(--line);display:grid;place-items:center;font-size:10px;color:var(--faint);cursor:pointer;transition:.14s}
.dots .d.on{background:var(--gold);border-color:var(--gold);color:#1a140a;font-weight:700}
.dots .d.today{box-shadow:0 0 0 2px var(--gold-2)}

/* ACHIEVEMENTS */
.ach{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);transition:.18s}
.ach.locked{opacity:.4}
.ach .em{font-size:26px;width:46px;height:46px;display:grid;place-items:center;border-radius:12px;background:var(--gold-soft);flex:0 0 auto}
.ach .nm{font-weight:600;font-size:14px}
.ach .ds{font-size:12px;color:var(--faint)}

/* TOAST */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--gold);color:var(--ink);padding:13px 22px;border-radius:13px;box-shadow:var(--shadow);z-index:200;opacity:0;transition:.3s;font-weight:600;font-size:13.5px;display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* MODAL */
.scrim{position:fixed;inset:0;background:rgba(5,5,7,.72);backdrop-filter:blur(6px);z-index:150;display:none;align-items:center;justify-content:center;padding:24px;animation:fade .2s}
.scrim.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:20px;max-width:560px;width:100%;padding:30px;max-height:86vh;overflow-y:auto;box-shadow:var(--shadow)}

.divider{height:1px;background:var(--line);margin:22px 0}
.mut{color:var(--muted)} .fa{color:var(--faint)} .gold{color:var(--gold-2)}
.tiny{font-size:12px} .center{text-align:center}
.row{display:flex;gap:12px;align-items:center}
.sp{justify-content:space-between}
.tag{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}
@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-300px;top:0;bottom:0;width:264px;z-index:120;transition:.3s}
  .sidebar.open{left:0}
  .wrap{padding:24px 18px 100px}
  h1.display{font-size:32px}
  .menu-btn{display:grid !important}
}
.menu-btn{display:none;position:fixed;top:16px;left:16px;z-index:130;width:42px;height:42px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line-2);place-items:center}

/* ===== AUTH SCREEN ===== */
.app{display:none}
.authwrap{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .4s}
.authcard{width:100%;max-width:430px;background:linear-gradient(180deg,rgba(27,27,36,.85),rgba(21,21,28,.92));border:1px solid var(--line-2);border-radius:22px;padding:38px 34px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.authcard::after{content:"";position:absolute;top:-60px;right:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,106,.16),transparent 70%);pointer-events:none}
.authcard .mark{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.1}
.authcard .mark em{font-style:italic;color:var(--gold-2)}
.authcard .sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:8px 0 22px}
.authcard h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 4px}
.authcard p.am{color:var(--muted);font-size:13.5px;margin:0 0 20px}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:11px;border:1px solid var(--line-2);background:#fff;color:#1a140a;font-weight:600;font-size:14px;transition:.16s}
.gbtn:hover{filter:brightness(.96)}
.orline{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin:18px 0}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}
.authmsg{font-size:12.5px;border-radius:10px;padding:10px 12px;margin-top:14px;display:none}
.authmsg.err{display:block;background:rgba(224,139,125,.12);border:1px solid rgba(224,139,125,.3);color:var(--red)}
.authmsg.ok{display:block;background:rgba(127,209,168,.12);border:1px solid rgba(127,209,168,.3);color:var(--green)}
.authswitch{text-align:center;font-size:13px;color:var(--muted);margin-top:18px}
.authswitch a{color:var(--gold-2);font-weight:600;cursor:pointer}
.banner{background:var(--gold-soft);border-bottom:1px solid rgba(201,168,106,.25);color:var(--gold-2);font-size:12.5px;padding:8px 16px;text-align:center}
.acct{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.acct .em{color:var(--ink);font-weight:600;word-break:break-all}
.acct .so{color:var(--faint);cursor:pointer;font-weight:600}
.acct .so:hover{color:var(--red)}
.syncdot{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--faint);margin-top:6px}
.syncdot .d{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.syncdot.saving .d{background:var(--gold);animation:pulse 1s infinite}
.syncdot.saved .d{background:var(--green)}
.syncdot.off .d{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
</style>
</head>

/* ---- cloud + cache config (Firebase) ---- */
const LOCAL_MODE = !CONFIG.apiKey || CONFIG.apiKey.indexOf("YOUR-")>=0 || !CONFIG.projectId || CONFIG.projectId.indexOf("YOUR-")>=0;
let fbAuth=null, fbDb=null, CURRENT_USER=null, MEM=null, SYNC="idle", syncT=null;
function freshDefault(){return JSON.parse(JSON.stringify(DEFAULT))}
function cacheKey(){return KEY+(CURRENT_USER?("_"+CURRENT_USER.uid):"")}
function lsGet(){try{return localStorage.getItem(cacheKey())}catch(e){return MEM}}
function lsSet(v){try{localStorage.setItem(cacheKey(),v)}catch(e){MEM=v}}
function loadCache(){try{const r=JSON.parse(lsGet());return r?Object.assign(freshDefault(),r):freshDefault()}catch(e){return freshDefault()}}
let S=freshDefault(); /* real data loads after auth resolves */
function userDoc(){return fbDb.collection(DATA_COLLECTION).doc(CURRENT_USER.uid)}

/* save = instant local cache + debounced cloud sync */
let dirty=false;
function save(){lsSet(JSON.stringify(S));dirty=true;scheduleCloud();}
function scheduleCloud(){
  if(LOCAL_MODE||!CURRENT_USER||!fbDb)return;
  setSync("saving");clearTimeout(syncT);syncT=setTimeout(cloudSave,1200);
}
async function cloudSave(){
  if(!fbDb||!CURRENT_USER)return;
  clearTimeout(syncT);
  try{
    await userDoc().set({data:S,email:CURRENT_USER.email||null,updatedAt:new Date().toISOString()},{merge:true});
    dirty=false;setSync("saved");
  }catch(e){setSync("off");}
}
/* flush any pending change immediately (used on tab hide / close / sign-out) */
function flushCloud(){if(dirty)cloudSave();}
if(typeof window!=="undefined"){
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")flushCloud();});
  window.addEventListener("pagehide",flushCloud);
  window.addEventListener("beforeunload",flushCloud);
}
function setSync(s){SYNC=s;const el=document.getElementById("syncdot");if(el){el.className="syncdot "+(s==="idle"?"":s);el.querySelector(".lbl").textContent=({saving:"Saving…",saved:"Synced",off:"Offline — saved locally",idle:"Synced"}[s]||"");}}
function today(){return new Date().toISOString().slice(0,10)}
function esc(s){return(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(){return Math.random().toString(36).slice(2,9)}

/* streak + activity */
function touchActivity(){
  const t=today();
  if(S.lastActive===t)return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak = (S.lastActive===y)?S.streak+1:1;
  if(S.streak>S.bestStreak)S.bestStreak=S.streak;
  S.lastActive=t; save();
}
function addPoints(n){S.points=(S.points||0)+n;save();}
function lessonsByLevel(n){return LESSONS.filter(l=>l.lvl===n)}
function lvlDone(s,n){return lessonsByLevel(n).every(l=>s.done.includes(l.id))}
function lvlProgress(n){const a=lessonsByLevel(n);return a.length?a.filter(l=>S.done.includes(l.id)).length/a.length:0}
function levelUnlocked(n){return n===1||lvlDone(S,n-1)}
function overallProgress(){return Math.round(S.done.length/LESSONS.length*100)}

  ACHIEVEMENTS.forEach(a=>{if(!S.achievements.includes(a.id)&&a.test(S)){S.achievements.push(a.id);nu.push(a);}});

}

      <div class="body"><div class="x">${esc(x.text)}</div><div class="y">${x.type==='stop'?'Stop':'Do'} &middot; ${timeAgo(x.ts)}</div></div>
      <button class="del" title="Mark missed" onclick="markLedger('${x.id}','broke')">&times;</button>
    </div>`).join(""):`<div class="empty"><div class="ico">&#9878;</div>No open commitments. The more you keep your word, the more reality trusts you.</div>`}

function addLedger(){const txt=val('lg_text');if(!txt){toast("Write a commitment first");return;}S.ledger.unshift({id:uid(),text:txt,type:document.getElementById('lg_type').value,status:'open',ts:Date.now()});save();toolLedger();}
function markLedger(id,status){const x=S.ledger.find(y=>y.id===id);if(!x)return;x.status=status;x.ts=Date.now();if(status==='kept'){addPoints(10);touchActivity();toast("&#10003; Kept &middot; self-trust +1 (+10)");}else{toast("Logged honestly. You can lie to others, never to the universe.");}save();checkAch();renderSidebar();toolLedger();}
function timeAgo(ts){const d=Math.floor((Date.now()-ts)/1000);if(d<60)return"just now";if(d<3600)return Math.floor(d/60)+"m ago";if(d<86400)return Math.floor(d/3600)+"h ago";return Math.floor(d/86400)+"d ago";}

function keysScore(){

function addJournal(){const t=val('j_new');if(!t){toast("Write something first");return;}S.journal.unshift({id:uid(),prompt:"",text:t,ts:Date.now()});addPoints(5);touchActivity();save();checkAch();toast("&#128221; Entry saved (+5)");renderJournal();}
function delJournal(id){S.journal=S.journal.filter(j=>j.id!==id);save();renderJournal();}

/* ============ INSIGHT LIBRARY ============ */
function buildLibrary(){
  let cards=[];
  LESSONS.forEach(l=>{
    cards.push({cat:"Principle",chapter:l.chapter,lesson:l.id,title:l.title,body:l.principle});
    cards.push({cat:"Mental Model",chapter:l.chapter,lesson:l.id,title:l.model.name,body:l.model.body});
    cards.push({cat:"Quote",chapter:l.chapter,lesson:l.id,title:l.chapter,body:'"'+l.quote.text+'" — '+l.quote.cite});
    cards.push({cat:"Behaviour",chapter:l.chapter,lesson:l.id,title:l.title,body:l.behavior});
  });
  return cards;
}
let LIB=buildLibrary();
function renderLibrary(){
  document.getElementById('main').innerHTML=`<div class="wrap view">
    <p class="eyebrow">Every lesson, framework & quote</p>
    <h1 class="display">Insight <em>Library</em></h1>
    <p class="lead">Searchable distillation of the whole book — principles, mental models, quotes, and behaviour changes.</p>
    <div class="searchwrap" style="margin-top:24px"><span class="si">&#128269;</span><input class="search" id="lib_q" placeholder="Search frequency, conviction, beliefs, emotion…" oninput="filterLib()"></div>
    <div class="row" style="gap:8px;flex-wrap:wrap;margin:8px 0 18px" id="lib_cats">
      ${["All","Principle","Mental Model","Quote","Behaviour"].map((c,i)=>`<span class="chip ${i===0?'gold':''}" onclick="libCat('${c}',this)">${c}</span>`).join("")}
    </div>
    <div class="grid g2" id="lib_grid"></div>
  </div>`;
  TW={cat:"All",q:""};filterLib();
}
function libCat(c,el){TW.cat=c;document.querySelectorAll('#lib_cats .chip').forEach(x=>x.classList.remove('gold'));el.classList.add('gold');filterLib();}
function filterLib(){
  const q=(document.getElementById('lib_q')?document.getElementById('lib_q').value:"").toLowerCase();TW.q=q;
  let items=LIB.filter(c=>(TW.cat==="All"||c.cat===TW.cat)&&(!q||(c.title+c.body+c.chapter).toLowerCase().includes(q)));
  const g=document.getElementById('lib_grid');
  g.innerHTML=items.length?items.map(c=>`<div class="lib-card" onclick="go('lesson','${c.lesson}')">
    <div class="cat">${c.cat} &middot; ${esc(c.chapter)}</div>
    <h4>${esc(c.title)}</h4><p>${esc(c.body)}</p></div>`).join(""):`<div class="empty"><div class="ico">&#128269;</div>Nothing matches "${esc(q)}".</div>`;
}

/* ============ MASTERY CHALLENGES ============ */
function renderChallenges(){
  document.getElementById('main').innerHTML=`<div class="wrap view">
    <p class="eyebrow">Build the muscle over time</p>
    <h1 class="display">Mastery <em>Challenges</em></h1>
    <p class="lead">Structured commitments — 7, 14, 30, and 90 days. Manifestation works like building muscle: start with smaller wins, then work your way up.</p>
    <div class="grid g2" style="margin-top:26px">
      ${CHALLENGES.map(c=>{
        const st=S.challenges[c.id];
        const doneN=st?st.days.filter(Boolean).length:0;
        const pct=st?Math.round(doneN/c.days*100):0;
        return `<div class="card">
          <div class="row sp"><div class="tag" style="color:var(--gold)">${c.days} days &middot; ${esc(c.focus)}</div>${st&&st.complete?'<span class="chip green">&#10003; Complete</span>':''}</div>
          <h3 class="serif" style="font-size:21px;margin:10px 0 6px">${esc(c.name)}</h3>
          <p class="mut tiny" style="margin:0 0 8px">${esc(c.desc)}</p>
          <div class="callout" style="margin:8px 0"><div class="lab">Daily action</div>${esc(c.daily)}</div>
          ${st?`<div class="row" style="gap:12px;margin:6px 0"><div class="lbar" style="flex:1;max-width:none"><i style="width:${pct}%"></i></div><span class="tiny fa">${doneN}/${c.days}</span></div>
            <div class="dots">${st.days.map((d,i)=>`<div class="d ${d?'on':''} ${i===doneN&&!d?'today':''}" onclick="markChallenge('${c.id}',${i})" title="Day ${i+1}">${i+1}</div>`).join("")}</div>
            <button class="btn sm ghost" onclick="resetChallenge('${c.id}')">Reset challenge</button>`
          :`<div class="btnrow" style="margin-top:8px"><button class="btn sm primary" onclick="startChallenge('${c.id}')">Start the ${c.days}-day challenge</button></div>`}
        </div>`;
      }).join("")}
    </div>
  </div>`;
}
function startChallenge(id){const c=CHALLENGES.find(x=>x.id===id);S.challenges[id]={start:today(),days:new Array(c.days).fill(false),complete:false};save();toast("&#127919; Challenge started");renderChallenges();}
function markChallenge(id,i){
  const st=S.challenges[id];if(!st)return;
  st.days[i]=!st.days[i];
  st.complete=st.days.every(Boolean);
  if(st.days[i]){addPoints(5);touchActivity();}
  if(st.complete){addPoints(50);toast("&#127942; Challenge complete! (+50)");}
  save();checkAch();renderSidebar();renderChallenges();
}
function resetChallenge(id){delete S.challenges[id];save();renderChallenges();}

/* ============ RENDER DISPATCH ============ */
function render(){
  renderSidebar();
  const v=VIEW.name;
  if(v==="dashboard")renderDashboard();
  else if(v==="journey")renderJourney();
  else if(v==="level")renderLevel(VIEW.param);
  else if(v==="lesson")renderLesson(VIEW.param);
  else if(v==="lab")renderLab();
  else if(v==="tool")renderTool(VIEW.param);
  else if(v==="practices")renderPractices();
  else if(v==="coach")renderCoach();
  else if(v==="journal")renderJournal();
  else if(v==="library")renderLibrary();
  else if(v==="challenges")renderChallenges();
  else if(v==="progress")renderProgress();
  else renderDashboard();
}

    <div style="font-size:32px">&#10024;</div>

    <p class="mut" style="max-width:42ch;margin:0 auto 16px">This is not a summary of <em>Outsmarting Reality</em> — it's a system for living it. Six levels, six interactive tools, daily practice, a coach, and a journal that tracks your transformation.</p>

/* ============ AUTH + BOOT ============ */
let AUTH_MODE="signin";
function showAuth(){document.getElementById('authwrap').style.display='flex';document.querySelector('.app').style.display='none';}
function hideAuth(){document.getElementById('authwrap').style.display='none';document.querySelector('.app').style.display='grid';}
function authToggle(){
  AUTH_MODE=AUTH_MODE==="signin"?"signup":"signin";
  const signup=AUTH_MODE==="signup";
  document.getElementById('auth_title').textContent=signup?"Create your account":"Welcome back";
  document.getElementById('auth_sub').textContent=signup?"Start your journey. Your progress syncs across every device.":"Sign in to continue your journey. Your progress syncs across every device.";
  document.getElementById('auth_submit').textContent=signup?"Create account":"Sign in";
  document.getElementById('auth_pw').setAttribute('autocomplete',signup?'new-password':'current-password');
  document.getElementById('auth_switch').innerHTML=signup?`Already have an account? <a onclick="authToggle()">Sign in</a>`:`New here? <a onclick="authToggle()">Create an account</a>`;
  authMsg("");
}
function authMsg(t,ok){const el=document.getElementById('auth_msg');el.className="authmsg"+(t?(ok?" ok":" err"):"");el.textContent=t;}
function fbErr(e){
  const c=(e&&e.code)||"";
  if(c.indexOf("email-already-in-use")>=0)return "That email already has an account — try signing in.";
  if(c.indexOf("invalid-email")>=0)return "That doesn't look like a valid email.";
  if(c.indexOf("weak-password")>=0)return "Password should be at least 6 characters.";
  if(c.indexOf("wrong-password")>=0||c.indexOf("invalid-credential")>=0)return "Incorrect email or password.";
  if(c.indexOf("user-not-found")>=0)return "No account with that email yet — create one below.";
  if(c.indexOf("too-many-requests")>=0)return "Too many attempts. Please wait a moment and try again.";
  if(c.indexOf("popup-closed")>=0||c.indexOf("cancelled-popup")>=0)return "Sign-in was cancelled.";
  if(c.indexOf("popup-blocked")>=0)return "Your browser blocked the popup — allow popups and try again.";
  if(c.indexOf("network")>=0)return "Network error. Check your connection.";
  if(c.indexOf("operation-not-allowed")>=0)return "This sign-in method isn't enabled yet in Firebase.";
  return (e&&e.message)||"Something went wrong. Please try again.";
}
async function authSubmit(){
  const email=document.getElementById('auth_email').value.trim();
  const pw=document.getElementById('auth_pw').value;
  if(!email||!pw){authMsg("Enter your email and password.");return;}
  const btn=document.getElementById('auth_submit');btn.disabled=true;btn.textContent="Please wait…";
  try{
    if(AUTH_MODE==="signup") await fbAuth.createUserWithEmailAndPassword(email,pw);
    else await fbAuth.signInWithEmailAndPassword(email,pw);
    /* onAuthStateChanged handles the rest */
  }catch(e){authMsg(fbErr(e));}
  btn.disabled=false;btn.textContent=AUTH_MODE==="signup"?"Create account":"Sign in";
}
async function googleSignIn(){
  try{const provider=new firebase.auth.GoogleAuthProvider();await fbAuth.signInWithPopup(provider);}
  catch(e){authMsg(fbErr(e));}
}
async function signOut(){try{await cloudSave();}catch(e){}try{await fbAuth.signOut();}catch(e){}CURRENT_USER=null;location.reload();}

let BOOTED=false;
async function bootApp(user){
  if(BOOTED)return; BOOTED=true;
  CURRENT_USER=user;
  S=loadCache(); /* instant paint from cache */
  if(fbDb){
    try{
      const snap=await userDoc().get();
      if(snap.exists && snap.data() && snap.data().data){S=Object.assign(freshDefault(),snap.data().data);}
      else{await userDoc().set({data:S,email:user.email||null,updatedAt:new Date().toISOString()},{merge:true});}
      setSync("saved");
    }catch(e){setSync("off");}
  }
  hideAuth();
  touchActivity();checkAch();render();
  if(!S.seenIntro)setTimeout(welcome,400);
}
function boot(){
  if(LOCAL_MODE){
    S=loadCache();hideAuth();touchActivity();checkAch();render();
    if(!S.seenIntro)setTimeout(welcome,400);return;
  }
  if(!window.firebase||!firebase.initializeApp){showAuth();authMsg("Could not load Firebase. Check your connection and refresh.");return;}
  try{
    firebase.initializeApp(CONFIG);
    fbAuth=firebase.auth();
    fbDb=firebase.firestore();
  }catch(e){showAuth();authMsg("Firebase config looks off. Double-check the values from your console.");return;}
  showAuth(); /* default until auth state resolves */
  fbAuth.onAuthStateChanged(function(user){
    if(user){ if(!BOOTED)bootApp(user); }
    else{ if(BOOTED){CURRENT_USER=null;BOOTED=false;location.reload();} else showAuth(); }
  });
}
boot();
</script>
