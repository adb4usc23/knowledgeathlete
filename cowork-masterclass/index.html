<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Cowork Masterclass</title>
<meta name="description" content="A hands-on masterclass for getting started with Cursor, with real screenshots, guided projects, and quizzes.">
<style>
:root{
  --bg:#f5f2ea; --panel:#fbfaf6; --ink:#16181b; --muted:#666a70; --line:#dedacd;
  --accent:#d8432a; --accent-ink:#fff; --soft:#f0e9d9; --ok:#1f7a4d; --okbg:#e3f1e8;
  --warn:#8a5a00; --warnbg:#fbf0d4; --code:#ece7d9; --shadow:0 1px 2px rgba(20,20,20,.06),0 12px 32px -12px rgba(20,20,20,.18);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121315; --panel:#191b1e; --ink:#ecebe6; --muted:#9a9da3; --line:#2c2f34;
  --accent:#ff6a4d; --accent-ink:#17110f; --soft:#22252a; --ok:#6fd3a0; --okbg:#17281f;
  --warn:#f0c264; --warnbg:#2b2413; --code:#23262b; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#121315; --panel:#191b1e; --ink:#ecebe6; --muted:#9a9da3; --line:#2c2f34;
  --accent:#ff6a4d; --accent-ink:#17110f; --soft:#22252a; --ok:#6fd3a0; --okbg:#17281f;
  --warn:#f0c264; --warnbg:#2b2413; --code:#23262b; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
kbd{font:600 .8em var(--mono);background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:.1em .45em;white-space:nowrap}
code{font:.88em var(--mono);background:var(--code);padding:.12em .38em;border-radius:4px}

/* layout */
.app{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:22px 16px 28px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0 6px;text-align:left}
.brand .mark{width:30px;height:30px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 15px var(--mono)}
.brand b{font:600 1.05rem var(--serif);letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.meter{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.meter .row{display:flex;justify-content:space-between;align-items:baseline;font-size:.82rem;color:var(--muted)}
.meter .row b{font:600 1.5rem var(--serif);color:var(--ink)}
.bar{height:6px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.nav h5{margin:14px 8px 6px;font:600 .7rem var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.nav button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;font-size:.9rem;line-height:1.35}
.nav button:hover{background:var(--soft)}
.nav button.on{background:var(--ink);color:var(--bg)}
.dot{flex:none;width:17px;height:17px;margin-top:1px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:10px;line-height:1}
.done .dot{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.done .dot::after{content:"✓"}
.nav button.quiz .dot{border-radius:4px}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:.8rem;color:var(--muted)}
.sidefoot button{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.82rem;text-align:left}
.sidefoot button:hover{border-color:var(--ink)}
.who{padding:0 4px}

main{min-width:0}
.top{display:none;position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;gap:12px}
.top button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.top .bar{flex:1;margin:0}
.page{max-width:820px;margin:0 auto;padding:56px 32px 96px}
.eyebrow{font:600 .74rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font:600 clamp(2rem,4.6vw,3.1rem)/1.1 var(--serif);margin:.3em 0 .35em;letter-spacing:-.01em;text-wrap:balance}
h2{font:600 1.6rem/1.2 var(--serif);margin:0 0 .3em}
h3{font:600 1.28rem/1.25 var(--serif);margin:2.1em 0 .5em}
h4{font:600 1rem var(--sans);margin:0 0 .3em}
.meta{color:var(--muted);font-size:.88rem;display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.lede{font:1.18rem/1.6 var(--serif);color:var(--ink)}
.small{font-size:.86rem;color:var(--muted)}
ul,ol{padding-left:1.25em}
li{margin:.35em 0}

/* hero */
.hero{border-bottom:1px solid var(--line);padding-bottom:34px;margin-bottom:34px}
.hero p{font:1.2rem/1.6 var(--serif);max-width:60ch;color:var(--muted)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 20px;font-weight:650;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.btn:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:30px 0 0}
.stats div{background:var(--panel);padding:14px 16px}
.stats b{display:block;font:600 1.5rem var(--serif)}
.stats span{font-size:.78rem;color:var(--muted)}
.mods{display:grid;gap:12px}
.mod{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;width:100%}
.mod:hover{border-color:var(--ink);box-shadow:var(--shadow)}
.mod .n{font:600 2rem var(--serif);color:var(--accent);width:1.4em}
.mod p{margin:.15em 0 0;color:var(--muted);font-size:.92rem}
.mod .pc{font:600 .8rem var(--mono);color:var(--muted)}

/* lesson blocks */
.shot{margin:26px 0}
.shot.narrow .frame{display:inline-block;max-width:100%}.shot.narrow img{width:auto;max-width:100%}
.frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--shadow);cursor:zoom-in}
.frame img{display:block;width:100%;height:auto}
figcaption{font-size:.86rem;color:var(--muted);margin-top:9px;padding-left:12px;border-left:2px solid var(--accent)}
.steps{counter-reset:s;list-style:none;padding:0;margin:18px 0}
.steps li{counter-increment:s;position:relative;padding:10px 0 10px 46px;border-top:1px solid var(--line);margin:0}
.steps li:last-child{border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);position:absolute;left:4px;top:10px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 .82rem var(--mono)}
.prompt{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:16px 0;background:var(--panel)}
.prompt-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;border-bottom:1px solid var(--line);font:600 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.copy{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 10px;font:600 .72rem var(--sans);letter-spacing:0;text-transform:none}
.copy:hover{border-color:var(--ink)}
.prompt pre{margin:0;padding:14px;font:.9rem/1.55 var(--mono);white-space:pre-wrap;word-break:break-word}
.note{border-radius:12px;padding:14px 16px;margin:20px 0;background:var(--okbg);border:1px solid transparent}
.note b{font:600 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ok)}
.note p{margin:.25em 0 0}
.note.warn{background:var(--warnbg)}.note.warn b{color:var(--warn)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.cols.three{grid-template-columns:repeat(3,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card p{margin:0;font-size:.92rem;color:var(--muted)}
.tablewrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--panel)}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
.loop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0}
.loop span{background:var(--ink);color:var(--bg);border-radius:99px;padding:6px 16px;font:600 .85rem var(--mono)}
.loop i{color:var(--muted);font-style:normal}
details.coder{border:1px dashed var(--line);border-radius:12px;padding:0 16px;margin:20px 0;background:var(--panel)}
details.coder summary{cursor:pointer;padding:12px 0;font:600 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
details.coder[open]{padding-bottom:12px}
pre.code{background:var(--code);border-radius:10px;padding:14px;font:.84rem/1.55 var(--mono);overflow-x:auto;white-space:pre}
.next{display:block;border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:var(--panel);margin-top:28px;text-decoration:none;color:var(--ink)}
.next:hover{border-color:var(--ink)}.next b{font:600 1.1rem var(--serif)}.next span{display:block;color:var(--muted);font-size:.9rem}

.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:48px;padding-top:24px;border-top:1px solid var(--line)}
.btn.done-btn.is{background:var(--okbg);color:var(--ok)}

/* quiz */
.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0}
.q h4{font:600 1.05rem/1.4 var(--serif);margin-bottom:12px}
.q label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer}
.q label:hover{border-color:var(--ink)}
.q input{margin-top:5px;accent-color:var(--accent)}
.q label.right{background:var(--okbg);border-color:var(--ok)}
.q label.wrong{background:var(--warnbg);border-color:var(--warn)}
.q .why{display:none;font-size:.9rem;color:var(--muted);margin-top:10px}
.q.graded .why{display:block}
.result{border-radius:14px;padding:20px;margin:20px 0;background:var(--okbg);display:none}
.result.show{display:block}.result.fail{background:var(--warnbg)}
.result b{font:600 1.5rem var(--serif)}
.cert{text-align:center;border:1px solid var(--line);border-radius:18px;padding:44px 24px;background:var(--panel);box-shadow:var(--shadow);margin:24px 0}
.cert h2{font-size:2rem}

.lightbox{position:fixed;inset:0;background:rgba(10,10,10,.86);display:none;place-items:center;z-index:50;padding:20px;cursor:zoom-out}
.lightbox.show{display:grid}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}
.scrim{display:none}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;z-index:20;width:min(320px,86vw);transform:translateX(-102%);transition:transform .25s}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}
  .top{display:flex}
  .page{padding:32px 16px 72px}
  .cols,.cols.three{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .mod{grid-template-columns:auto 1fr}.mod .pc{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <button class="brand" id="home"><span class="mark">&gt;_</span><span><b>Claude Cowork Masterclass</b><small>Knowledge Athlete</small></span></button>
    <div class="meter"><div class="row"><span>Your progress</span><b id="pct">0%</b></div><div class="bar"><i id="bar"></i></div><div class="row" style="margin-top:8px"><span id="count"></span><span id="sync">Saved on this device</span></div></div>
    <nav class="nav" id="nav" aria-label="Lessons"></nav>
    <div class="sidefoot">
      <div class="who" id="who"></div>
      <button id="auth" hidden>Sign in with Google to sync</button>
      <button id="theme">Switch light / dark</button>
      <button id="reset">Reset my progress</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main>
    <div class="top"><button id="menu" aria-label="Open lesson menu">Menu</button><div class="bar"><i id="bar2"></i></div><b id="pct2">0%</b></div>
    <div class="page" id="page"></div>
  </main>
</div>
<div class="lightbox" id="lb"><img alt=""></div>

<p class="lede">Chat answers questions. Cowork does the work. You describe a finished result, Claude plans the steps, carries them out across your files and tools, and hands back something you can open.</p>
<h3>Chat, Cowork, or Code?</h3>
<p>Claude comes in three working styles. Picking the right one is the first skill.</p>
<div class="cols three">
  <div class="card"><h4>Chat</h4><p>For anything that fits in a few exchanges: a question, an explanation, a brainstorm, a second opinion.</p></div>

<p>A quick test: if you would hand the job to an assistant and expect a file back, it is a Cowork task.</p>
<h3>What Cowork can do</h3>
<ul>
<li><b>Work with your files.</b> Read a folder, organize and rename files, and save new ones beside them.</li>
<li><b>Produce real documents.</b> Reports, spreadsheets with working formulas, and slide decks.</li>
<li><b>Research.</b> Search the web, read sources, and pull the findings together.</li>
<li><b>Use your tools.</b> With connectors, it can work with apps such as email, calendar, and cloud storage.</li>
<li><b>Run on a schedule.</b> Repeat a task daily or weekly without you starting it.</li>

<h3>The project you will work on</h3>

<p class="lede">The practice folder is a mess on purpose. Your first real task is to have Cowork organize it, and to watch how it asks before acting.</p>
<h3>Before</h3>
${code(`riverside-popup/
  IMG_4471 notes.txt

  logo-old-DELETE.txt

<h3>Ask</h3>
${prompt(`Organize this folder. Read each file first so the names reflect what is inside.

- Rename the meeting notes to the pattern YYYY-MM-DD-meeting-notes.txt using the date inside each file.
- Give Untitled.txt a clear name.
- Put notes in a "notes" folder and data files in a "data" folder.
- Do not delete anything. If a file looks like it should be deleted, list it and ask me.

Show me your plan before you make changes.`)}
<h3>Review the plan</h3>
<p>Cowork replies with what it intends to do. Read it like you would read a colleague's proposal. Check that the three meeting dates are right: September 8, September 15, and September 29. One file only says “9/15”, so see whether Cowork states the year it assumed.</p>
<h3>Approve the actions</h3>
<p>How often Cowork stops to ask depends on the approval mode:</p>
<div class="tablewrap"><table>
<thead><tr><th>Mode</th><th>What happens</th><th>Use it when</th></tr></thead>
<tbody>
<tr><td><b>Manual</b></td><td>Claude pauses before each action. You choose <b>Allow</b> or <b>Deny</b>.</td><td>You are learning, or the files matter</td></tr>
<tr><td><b>Auto</b></td><td>Claude proceeds on its own and runs safety checks as it goes. Risky actions are blocked or sent back to you.</td><td>Routine work in a folder you have backed up</td></tr>
<tr><td><b>Skip</b></td><td>No checks and no requests.</td><td>Only for workflows you trust completely</td></tr>
</tbody></table></div>
<p>Stay on <b>Manual</b> for this course. Seeing each request teaches you what Cowork actually does to complete a task.</p>
<h3>After</h3>
<p>Your result should look close to this:</p>
${code(`riverside-popup/
  logo-old-DELETE.txt

    expenses export.csv

    2026-09-15-meeting-notes.txt

<p>Cowork should have asked about <code>logo-old-DELETE.txt</code> instead of removing it. Permanently deleting a file needs your explicit permission.</p>
${tip("Open the folder on your computer and look. The files really moved. Checking the result in the real place, not just in Cowork's summary, is a habit to start today.")}`,

          body: `
<p class="lede">That first prompt worked because of how it was built. A Cowork request is closer to a short assignment than to a question.</p>
<h3>Five parts of a strong request</h3>
<div class="tablewrap"><table>
<thead><tr><th>Part</th><th>Question it answers</th><th>From the last lesson</th></tr></thead>
<tbody>
<tr><td><b>Outcome</b></td><td>What should exist when this is done?</td><td>An organized folder</td></tr>
<tr><td><b>Inputs</b></td><td>What should it read?</td><td>“Read each file first”</td></tr>
<tr><td><b>Format</b></td><td>What exactly should the result look like?</td><td>The file name pattern and the two folders</td></tr>
<tr><td><b>Limits</b></td><td>What must it not do?</td><td>“Do not delete anything”</td></tr>
<tr><td><b>Checkpoint</b></td><td>When should it stop and ask?</td><td>“Show me your plan before you make changes”</td></tr>
</tbody></table></div>
<h3>Weak and strong</h3>
<div class="cols">
  <div class="card"><h4>Weak</h4><p>“Clean up this folder.”</p></div>
  <div class="card"><h4>Strong</h4><p>“Rename the meeting notes to YYYY-MM-DD-meeting-notes.txt using the date inside each file. Do not delete anything. Show me your plan first.”</p></div>
</div>
<p>The weak version leaves every decision to Claude. It might do something reasonable. It might also delete the file you needed.</p>
<h3>The alignment line</h3>
<p>When a task is large or you are unsure how to describe it, add this to the end of your request:</p>
${prompt("Before we begin, repeat my ask back to me so we're aligned, then ask me as many clarifying questions as you have.")}
<p>Cowork often answers with a short set of multiple choice questions. Two minutes answering them saves a full run in the wrong direction.</p>
<h3>What makes a task worth delegating</h3>
<p>The best Cowork tasks tend to share these traits:</p>
<ul>
<li><b>Several inputs.</b> More than one file, folder, or app.</li>
<li><b>A file at the end.</b> A document, deck, or spreadsheet.</li>
<li><b>Repeats.</b> You will need it again next week or next month.</li>

<p class="lede">Cowork is useful because it can act. Everything in this last lesson follows from taking that seriously.</p>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const M = COURSE.meta, KEY = M.key;
  const PASS = 0.75;
  const lessons = COURSE.modules.flatMap((m) => m.lessons.map((l) => ({ ...l, mod: m })));
  const total = lessons.length + COURSE.modules.length;

  /* ---------- storage: local first, optional Firestore ---------- */
  let mem = null, state = { done: {}, quiz: {}, last: "" };
  const store = {
    load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return mem; } },
    save(s) { mem = s; try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} },
  };
  state = Object.assign(state, store.load() || {});
  let cloud = null;
  const merge = (a, b) => {
    const quiz = { ...a.quiz };
    for (const k in b.quiz || {}) if (!quiz[k] || b.quiz[k].score > quiz[k].score) quiz[k] = b.quiz[k];
    return { done: { ...(b.done || {}), ...a.done }, quiz, last: a.last || b.last || "" };
  };
  const persist = () => { state.updated = Date.now(); store.save(state); if (cloud) cloud.push(state).catch(() => setSync("Sync failed, saved on this device")); };
  const setSync = (t) => ($("#sync").textContent = t);

  async function initCloud() {
    const cfg = window.CM_FIREBASE_CONFIG;
    if (!cfg || !cfg.apiKey) return;
    try {
      const v = "https://www.gstatic.com/firebasejs/10.12.2/";
      const [{ initializeApp }, A, F] = await Promise.all([import(v + "firebase-app.js"), import(v + "firebase-auth.js"), import(v + "firebase-firestore.js")]);
      const app = initializeApp(cfg, M.id), auth = A.getAuth(app), db = F.getFirestore(app);
      const btn = $("#auth"); btn.hidden = false;
      btn.onclick = () => (auth.currentUser ? A.signOut(auth) : A.signInWithPopup(auth, new A.GoogleAuthProvider()).catch(() => {}));
      A.onAuthStateChanged(auth, async (u) => {
        if (!u) { cloud = null; btn.textContent = "Sign in with Google to sync"; $("#who").textContent = ""; setSync("Saved on this device"); return; }
        btn.textContent = "Sign out"; $("#who").textContent = "Signed in as " + (u.displayName || u.email);
        const ref = F.doc(db, "users", u.uid, "courses", M.id);
        cloud = { push: (s) => F.setDoc(ref, { ...s, name: u.displayName || "", email: u.email || "", total, completed: countDone() }, { merge: true }).then(() => setSync("Synced to your account")) };
        try { const snap = await F.getDoc(ref); if (snap.exists()) state = merge(state, snap.data()); persist(); render(); }
        catch { setSync("Sync unavailable, saved on this device"); }
      });
    } catch { /* offline or blocked: stay local */ }
  }

  /* ---------- progress ---------- */
  const passed = (m) => state.quiz[m.id] && state.quiz[m.id].score >= PASS;
  const countDone = () => lessons.filter((l) => state.done[l.id]).length + COURSE.modules.filter(passed).length;
  function paintProgress() {
    const n = countDone(), p = Math.round((n / total) * 100);
    $("#pct").textContent = $("#pct2").textContent = p + "%";
    $("#bar").style.width = $("#bar2").style.width = p + "%";
    $("#count").textContent = n + " of " + total + " done";
  }

  /* ---------- nav ---------- */
  let current = "";
  function paintNav() {
    $("#nav").innerHTML = COURSE.modules.map((m, i) => {
      const d = m.lessons.filter((l) => state.done[l.id]).length + (passed(m) ? 1 : 0);
      return `<h5><span>${i + 1}. ${m.title}</span><span>${d}/${m.lessons.length + 1}</span></h5>` +
        m.lessons.map((l) => `<button data-go="${l.id}" class="${state.done[l.id] ? "done" : ""} ${current === l.id ? "on" : ""}"><span class="dot"></span><span>${l.title}</span></button>`).join("") +
        `<button data-go="quiz-${m.id}" class="quiz ${passed(m) ? "done" : ""} ${current === "quiz-" + m.id ? "on" : ""}"><span class="dot"></span><span>Quiz: ${m.title}${state.quiz[m.id] ? " · " + Math.round(state.quiz[m.id].score * 100) + "%" : ""}</span></button>`;
    }).join("");
  }

  /* ---------- views ---------- */
  const order = COURSE.modules.flatMap((m) => [...m.lessons.map((l) => l.id), "quiz-" + m.id]);
  function home() {
    const n = countDone(), next = order.find((id) => id.startsWith("quiz-") ? !passed(COURSE.modules.find((m) => "quiz-" + m.id === id)) : !state.done[id]);
    const mins = lessons.reduce((a, l) => a + l.mins, 0);
    return `<section class="hero"><div class="eyebrow">${M.eyebrow}</div>
      <h1>${M.h1}</h1>
      <p>${M.intro}</p>
      <div class="cta">${n === total ? `<button class="btn" data-go="finish">View your completion</button>` : `<button class="btn" data-go="${next}">${n ? "Continue where you left off" : "Start lesson 1"}</button>`}
      ${M.downloads.map((d) => `<a class="btn ghost" download="${d.file}" href="${FILES[d.file]}">${d.label}</a>`).join("")}</div>
      <div class="stats"><div><b>${lessons.length}</b><span>lessons</span></div><div><b>${COURSE.modules.length}</b><span>quizzes</span></div><div><b>${M.stat[0]}</b><span>${M.stat[1]}</span></div><div><b>~${Math.round(mins / 60 * 2) / 2}h</b><span>total time</span></div></div></section>
      <h2>The path</h2><div class="mods">${COURSE.modules.map((m, i) => {
        const d = m.lessons.filter((l) => state.done[l.id]).length + (passed(m) ? 1 : 0);
        return `<button class="mod" data-go="${m.lessons[0].id}"><span class="n">${i + 1}</span><span><h4>${m.title}</h4><p>${m.blurb}</p></span><span class="pc">${d}/${m.lessons.length + 1}</span></button>`; }).join("")}</div>
      <p class="small" style="margin-top:28px">${M.note || `Screens and prices checked ${COURSE.checked}. Cursor changes often, so labels may move. This is an independent course and is not affiliated with Cursor.`}</p>${M.footer || ""}`;
  }
  function lessonView(l) {
    const i = order.indexOf(l.id), prev = order[i - 1], next = order[i + 1], mi = COURSE.modules.indexOf(l.mod);
    return `<div class="eyebrow">Module ${mi + 1} · ${l.mod.title}</div><h1>${l.title}</h1>
      <div class="meta"><span>Lesson ${lessons.indexOf(lessons.find((x) => x.id === l.id)) + 1} of ${lessons.length}</span><span>About ${l.mins} min</span></div>
      ${l.body}
      <div class="foot">${prev ? `<button class="btn ghost" data-go="${prev}">&larr; Back</button>` : "<span></span>"}
      <span style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost done-btn ${state.done[l.id] ? "is" : ""}" data-done="${l.id}">${state.done[l.id] ? "✓ Completed" : "Mark complete"}</button>
      <button class="btn" data-done="${l.id}" data-go="${next}">${next.startsWith("quiz") ? "Complete and take the quiz" : "Complete and continue"} &rarr;</button></span></div>`;
  }
  function quizView(m) {
    const best = state.quiz[m.id];
    return `<div class="eyebrow">Module ${COURSE.modules.indexOf(m) + 1} quiz</div><h1>${m.title}</h1>
      <div class="meta"><span>${m.quiz.length} questions</span><span>${Math.round(PASS * 100)}% to pass</span>${best ? `<span>Best score ${Math.round(best.score * 100)}%</span>` : ""}</div>
      <form id="quiz">${m.quiz.map((q, i) => `<div class="q"><h4>${i + 1}. ${q.q}</h4>${q.a.map((a, j) => `<label><input type="radio" name="q${i}" value="${j}" required><span>${a}</span></label>`).join("")}<div class="why">${q.why}</div></div>`).join("")}
      <div class="result" id="result"></div>
      <div class="foot"><button type="button" class="btn ghost" data-go="${m.lessons[m.lessons.length - 1].id}">&larr; Back to lesson</button><button class="btn" id="submit">Check my answers</button></div></form>`;
  }
  function finish() {
    const avg = Math.round(COURSE.modules.reduce((a, m) => a + (state.quiz[m.id] ? state.quiz[m.id].score : 0), 0) / COURSE.modules.length * 100);
    return `<div class="cert"><div class="eyebrow">Masterclass complete</div><h2>You finished ${M.title}.</h2>
      <p>${lessons.length} lessons, ${COURSE.modules.length} quizzes passed, average quiz score ${avg}%.</p>
      <p class="small">Completed ${new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" })}</p>
      <div class="cta" style="justify-content:center"><button class="btn" onclick="print()">Print or save as PDF</button><button class="btn ghost" data-go="">Back to overview</button></div></div>`;
  }

  function render() {
    const l = lessons.find((x) => x.id === current), m = COURSE.modules.find((x) => "quiz-" + x.id === current);
    $("#page").innerHTML = l ? lessonView(l) : m ? quizView(m) : current === "finish" ? finish() : home();
    paintNav(); paintProgress();
  }
  function go(id, scroll = true) {
    current = id || ""; state.last = current; store.save(state);
    try { history.replaceState(null, "", current ? "#" + current : location.pathname + location.search); } catch {}
    render(); $("#side").classList.remove("open"); $("#scrim").classList.remove("open");
    if (scroll) window.scrollTo(0, 0);
  }

  /* ---------- events ---------- */
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-done],[data-go],.copy,.frame");
    if (!t) return;
    if (t.classList.contains("copy")) {
      const txt = t.closest(".prompt").querySelector("pre").textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => (t.textContent = "Copied"), () => (t.textContent = "Select and copy"));
      setTimeout(() => (t.textContent = "Copy"), 1600); return;
    }
    if (t.classList.contains("frame")) { $("#lb img").src = t.querySelector("img").src; $("#lb").classList.add("show"); return; }
    if (t.dataset.done) {
      const id = t.dataset.done, advancing = "go" in t.dataset;
      if (advancing || !state.done[id]) state.done[id] = Date.now(); else delete state.done[id];
      persist(); if (!advancing) return render();
    }
    if ("go" in t.dataset) go(t.dataset.go);
  });
  document.addEventListener("submit", (e) => {
    if (e.target.id !== "quiz") return;
    e.preventDefault();
    const m = COURSE.modules.find((x) => "quiz-" + x.id === current); let right = 0;
    e.target.querySelectorAll(".q").forEach((box, i) => {
      const pick = +new FormData(e.target).get("q" + i); box.classList.add("graded");
      box.querySelectorAll("label").forEach((lab, j) => { lab.classList.remove("right", "wrong"); if (j === m.quiz[i].c) lab.classList.add("right"); else if (j === pick) lab.classList.add("wrong"); });
      if (pick === m.quiz[i].c) right++;
    });
    const score = right / m.quiz.length, prev = state.quiz[m.id];
    if (!prev || score > prev.score) state.quiz[m.id] = { score, at: Date.now() };
    state.quiz[m.id].tries = ((prev && prev.tries) || 0) + 1; persist(); paintNav(); paintProgress();
    const r = $("#result"), ok = score >= PASS, i = COURSE.modules.indexOf(m), nextM = COURSE.modules[i + 1], all = countDone() === total;
    r.className = "result show" + (ok ? "" : " fail");
    r.innerHTML = `<b>${right} of ${m.quiz.length} correct</b><p>${ok ? "Passed. Review the explanations above, then keep going." : "Not quite. Read the explanations above and try again. You need " + Math.round(PASS * 100) + "%."}</p>` +
      (ok ? `<button type="button" class="btn" data-go="${all ? "finish" : nextM ? nextM.lessons[0].id : ""}">${all ? "See your completion" : nextM ? "Start module " + (i + 2) : "Back to overview"} &rarr;</button>` : `<button type="button" class="btn" data-go="${current}">Try again</button>`);
    r.scrollIntoView({ block: "center", behavior: "smooth" });
  });
  $("#lb").onclick = () => $("#lb").classList.remove("show");
  document.addEventListener("keydown", (e) => e.key === "Escape" && $("#lb").classList.remove("show"));
  $("#home").onclick = () => go("");
  $("#menu").onclick = $("#scrim").onclick = () => { $("#side").classList.toggle("open"); $("#scrim").classList.toggle("open"); };
  $("#theme").onclick = () => {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem(KEY + "-theme", document.documentElement.dataset.theme); } catch {}
  };
  let armed = 0;
  $("#reset").onclick = (e) => {
    if (Date.now() - armed > 4000) { armed = Date.now(); e.target.textContent = "Click again to confirm reset"; setTimeout(() => (e.target.textContent = "Reset my progress"), 4000); return; }
    state = { done: {}, quiz: {}, last: "" }; persist(); e.target.textContent = "Reset my progress"; go("");
  };
  try { const t = localStorage.getItem(KEY + "-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  const h = location.hash.slice(1);
  current = order.includes(h) || h === "finish" ? h : "";
  render(); initCloud();
})();
</script>
</body>
</html>
