<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Frequency Effect — Companion Workbook</title>
<style>
  :root{
    --bg:#060b16; --bg-2:#0a1528; --panel:rgba(14,26,46,.72); --panel-solid:#0e1a2e;
    --panel-2:rgba(18,34,56,.8); --ink:#e9f2fc; --ink-dim:#90a6c4; --faint:#5e7498;
    --accent:#46c5f0; --accent-2:#7ee0e6; --accent-3:#3b74e8; --good:#58d3a6;
    --line:rgba(120,180,230,.14); --line-2:rgba(120,180,230,.26);
    --glow:rgba(70,197,240,.45); --accent-soft:rgba(70,197,240,.12);
    --r:14px; --shadow:0 22px 60px -22px rgba(0,8,24,.85);
    --serif:"Georgia",serif; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:var(--accent);text-decoration:none}
  button{font:inherit;cursor:pointer}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(120,180,230,.16);border-radius:20px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(120,180,230,.3)}

  /* ===== cosmic background + ripple/torus graphics ===== */
  .fx-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    background:
      radial-gradient(1100px 760px at 50% 120%, rgba(59,116,232,.20), transparent 60%),
      radial-gradient(900px 600px at 12% -10%, rgba(70,197,240,.12), transparent 55%),
      radial-gradient(800px 700px at 108% 4%, rgba(126,224,230,.08), transparent 55%),
      linear-gradient(180deg,#060b16 0%,#07101f 48%,#050a14 100%);}
  .fx-stars{position:absolute;inset:0;opacity:.5;
    background-image:radial-gradient(1.4px 1.4px at 20% 30%, rgba(200,230,255,.7), transparent),
      radial-gradient(1.2px 1.2px at 70% 20%, rgba(200,230,255,.5), transparent),
      radial-gradient(1.6px 1.6px at 40% 70%, rgba(180,220,255,.5), transparent),
      radial-gradient(1.1px 1.1px at 85% 55%, rgba(200,230,255,.5), transparent),
      radial-gradient(1.3px 1.3px at 55% 85%, rgba(200,230,255,.45), transparent),
      radial-gradient(1px 1px at 30% 50%, rgba(200,230,255,.4), transparent);
    background-repeat:no-repeat;}
  .fx-ripple{position:absolute;left:50%;bottom:-6%;transform:translateX(-50%);width:min(1400px,160vw);height:auto;opacity:.85}
  .fx-ripple ellipse{fill:none;stroke:var(--accent);transform-origin:center;}
  .r-ring{animation:ripple 7s ease-out infinite}
  @keyframes ripple{0%{opacity:0;stroke-width:2.4}18%{opacity:.5}100%{opacity:0;stroke-width:.4;transform:scale(1.14)}}
  .fx-torus{position:absolute;top:5%;right:4%;width:min(320px,34vw);opacity:.16;animation:spin 60s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fx-drop{fill:var(--accent-2);filter:drop-shadow(0 0 10px var(--glow))}

  /* ===== logo mark ===== */
  .logo-mark{width:40px;height:40px;flex:0 0 auto;filter:drop-shadow(0 0 8px rgba(70,197,240,.4))}
  .logo-mark.lg{width:60px;height:60px}

  /* ===== layout ===== */
  .app{position:relative;z-index:1;display:none;grid-template-columns:320px 1fr;min-height:100vh}
  @media (max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:static!important;height:auto!important;max-height:none}}

  .sidebar{background:linear-gradient(180deg,rgba(10,20,38,.86),rgba(8,16,30,.78));
    backdrop-filter:blur(16px);border-right:1px solid var(--line);
    padding:24px 18px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
  .brand-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .brand{letter-spacing:.2em;font-weight:700;font-size:10.5px;color:var(--accent);text-transform:uppercase;margin:0 0 3px}
  .title{font-size:21px;font-weight:700;margin:0;line-height:1.1;
    background:linear-gradient(120deg,#eaf4ff,#7ee0e6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .subtitle{font-size:11px;color:var(--ink-dim);letter-spacing:.14em;text-transform:uppercase;margin:12px 0 18px}

  .progress-wrap{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:16px}
  .progress-label{font-size:10.5px;color:var(--ink-dim);display:flex;justify-content:space-between;margin-bottom:7px;text-transform:uppercase;letter-spacing:.1em}
  .progress-bar{height:6px;background:rgba(10,20,38,.9);border-radius:5px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent-3),var(--accent),var(--accent-2));box-shadow:0 0 12px var(--glow);transition:width .4s;width:0%}

  .toolbar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .toolbar button{background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);padding:6px 11px;border-radius:7px;font-size:12px;transition:.15s}
  .toolbar button:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

  .nav-section{margin-top:12px}
  .nav-section-title{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:16px 0 7px;padding-left:4px;opacity:.9}
  .nav-item{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--ink-dim);margin-bottom:2px;border:1px solid transparent;transition:.14s}
  .nav-item:hover{background:var(--panel-2);color:var(--ink)}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);border-color:var(--line-2)}
  .nav-item .dot{width:8px;height:8px;border-radius:50%;background:#2b3c58;flex-shrink:0;margin-left:8px;transition:.2s}
  .nav-item.done .dot{background:var(--good);box-shadow:0 0 8px rgba(88,211,166,.6)}
  .nav-item.partial .dot{background:var(--accent);box-shadow:0 0 8px var(--glow)}

  .acct{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-dim)}
  .acct .em{color:var(--ink);font-weight:600;word-break:break-all}
  .acct .so{color:var(--faint);cursor:pointer;font-weight:600}
  .acct .so:hover{color:var(--accent)}
  .syncdot{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--faint);margin-top:6px}
  .syncdot .d{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .syncdot.saving .d{background:var(--accent);animation:pulse 1s infinite}
  .syncdot.saved .d{background:var(--good)}
  .syncdot.off .d{background:#e08b7d}
  @keyframes pulse{50%{opacity:.3}}

  /* ===== main ===== */
  .main{position:relative;padding:52px clamp(20px,5vw,60px);max-width:900px}
  .ch-section{font-size:11px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase;margin-bottom:10px;font-weight:600}
  .ch-title{font-size:clamp(28px,4vw,40px);margin:0 0 10px;line-height:1.12;letter-spacing:-.01em;
    background:linear-gradient(120deg,#eef6ff,#9fe8ec);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .ch-tagline{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px}
  .wave-divider{height:26px;margin:14px 0 26px;opacity:.7}
  .wave-divider svg{width:100%;height:100%;overflow:visible}
  .wave-divider path{fill:none;stroke:url(#wvg);stroke-width:2}

  .ch-summary{position:relative;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:0 12px 12px 0;padding:18px 22px;margin:0 0 30px;color:#c3d4ec;font-size:15px;backdrop-filter:blur(8px);box-shadow:var(--shadow)}
  .ch-summary p{margin:0}
  .ch-summary p+p{margin-top:10px}

  .prompt-group{margin-bottom:30px}
  .prompt-group-header{font-weight:600;font-size:15px;margin-bottom:14px;color:var(--accent-2);display:flex;align-items:center;gap:9px}
  .prompt-group-header::before{content:"";width:16px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),transparent)}

  .question{margin-bottom:22px}
  .q-text{font-size:15px;margin-bottom:8px;color:var(--ink)}
  .q-helper{font-size:12.5px;color:var(--ink-dim);margin-bottom:8px;font-style:italic}
  textarea{width:100%;min-height:90px;background:rgba(8,16,30,.7);color:var(--ink);border:1px solid var(--line-2);border-radius:10px;padding:13px 15px;font:inherit;font-size:14.5px;line-height:1.55;resize:vertical;transition:border-color .15s,box-shadow .15s}
  textarea::placeholder{color:var(--faint)}
  textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 0 18px -4px var(--glow)}
  textarea.short{min-height:44px}

  .examples{font-size:12.5px;color:var(--ink-dim);margin-top:6px;padding-left:14px}
  .examples li{margin-bottom:2px}
  .steps{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:18px;backdrop-filter:blur(8px)}
  .steps ol,.steps ul{margin:8px 0;padding-left:22px}
  .steps li{margin-bottom:6px;font-size:14.5px}

  .nav-bottom{display:flex;justify-content:space-between;gap:12px;margin-top:44px;padding-top:24px;border-top:1px solid var(--line)}
  .nav-bottom button{background:var(--panel);border:1px solid var(--line-2);color:var(--ink);padding:11px 17px;border-radius:9px;font-size:13.5px;transition:.15s}
  .nav-bottom button:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .nav-bottom button:disabled{opacity:.35;cursor:not-allowed}

  .save-indicator{position:fixed;bottom:18px;right:18px;background:var(--panel-solid);border:1px solid var(--accent);border-radius:8px;padding:7px 14px;font-size:12px;color:var(--good);opacity:0;transform:translateY(8px);transition:.2s;z-index:100;box-shadow:var(--shadow)}
  .save-indicator.show{opacity:1;transform:translateY(0)}
  .quote{color:var(--ink-dim);font-style:italic;border-left:2px solid var(--line-2);padding:8px 16px;margin:16px 0;font-size:14px}

  /* ===== welcome hero ===== */
  .welcome{text-align:center;padding:40px 0 60px;position:relative}
  .welcome .hero-mark{margin:0 auto 18px;display:flex;justify-content:center}
  .welcome h2{font-size:clamp(30px,5vw,46px);margin:0 0 14px;letter-spacing:-.01em;
    background:linear-gradient(120deg,#eef6ff,#7ee0e6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .welcome p{color:var(--ink-dim);max-width:580px;margin:0 auto 18px;font-size:15.5px}
  .welcome .btn-begin{background:linear-gradient(120deg,var(--accent-2),var(--accent));color:#04121f;border:none;padding:13px 28px;border-radius:10px;font-weight:700;font-size:14.5px;margin-top:14px;box-shadow:0 0 26px -6px var(--glow);transition:.15s}
  .welcome .btn-begin:hover{filter:brightness(1.08);transform:translateY(-1px)}

  /* ===== auth screen ===== */
  .authwrap{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
  .authwrap.show{display:flex}
  .authcard{position:relative;z-index:1;width:100%;max-width:430px;
    background:linear-gradient(180deg,rgba(14,28,50,.9),rgba(9,18,34,.94));border:1px solid var(--line-2);
    border-radius:20px;padding:36px 32px;box-shadow:var(--shadow);text-align:center}
  .authcard .logo-mark{margin:0 auto 14px}
  .authcard .abrand{letter-spacing:.2em;font-size:10.5px;text-transform:uppercase;color:var(--accent);font-weight:700}
  .authcard h2{font-family:inherit;font-size:22px;font-weight:700;margin:10px 0 4px;
    background:linear-gradient(120deg,#eef6ff,#7ee0e6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .authcard p.am{color:var(--ink-dim);font-size:13.5px;margin:0 0 20px}
  .fld{display:block;text-align:left;font-size:12px;font-weight:600;color:var(--ink-dim);margin:14px 0 6px}
  .ainput{width:100%;background:rgba(8,16,30,.8);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;color:var(--ink);font-size:14px;transition:.15s}
  .ainput:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:10px;border:1px solid var(--line-2);background:#fff;color:#1a1a1a;font-weight:600;font-size:14px;transition:.15s}
  .gbtn:hover{filter:brightness(.96)}
  .orline{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin:18px 0}
  .orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}
  .abtn{width:100%;margin-top:18px;background:linear-gradient(120deg,var(--accent-2),var(--accent));color:#04121f;border:none;padding:12px;border-radius:10px;font-weight:700;font-size:14px;box-shadow:0 0 22px -8px var(--glow)}
  .abtn:hover{filter:brightness(1.07)}
  .authmsg{font-size:12.5px;border-radius:9px;padding:10px 12px;margin-top:14px;display:none}
  .authmsg.err{display:block;background:rgba(224,139,125,.12);border:1px solid rgba(224,139,125,.3);color:#e9a79b}
  .authmsg.ok{display:block;background:rgba(88,211,166,.12);border:1px solid rgba(88,211,166,.3);color:var(--good)}
  .authswitch{font-size:13px;color:var(--ink-dim);margin-top:18px}
  .authswitch a{color:var(--accent-2);font-weight:600;cursor:pointer}
  .banner{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--accent-soft);border-bottom:1px solid var(--line-2);color:var(--accent-2);font-size:12.5px;padding:7px 16px;text-align:center}

  .menu-btn{display:none;position:fixed;top:14px;left:14px;z-index:60;width:42px;height:42px;border-radius:11px;background:var(--panel-solid);border:1px solid var(--line-2);color:var(--accent);place-items:center}
  @media (max-width:900px){.menu-btn{display:grid}}
</style>
</head>
<body>

 in</button><div class="authswitch" id="auth_switch">New here? <a onclick="authToggle()">Create an account</a></div></div></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand-row"><svg class="logo-mark" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="32" r="28" stroke="url(#lmgB)" stroke-width="1.6"/><path d="M32 11 L52 46 L12 46 Z" stroke="url(#lmgB)" stroke-width="1.6"/><circle cx="32" cy="35.5" r="8.5" stroke="url(#lmgB)" stroke-width="1.6"/><circle cx="32" cy="35.5" r="2.2" fill="#7ee0e6"/><defs><linearGradient id="lmgB" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse"><stop stop-color="#7ee0e6"/><stop offset="1" stop-color="#46c5f0"/></linearGradient></defs></svg><div><div class="brand">Companion Workbook</div><h1 class="title">The Frequency Effect</h1></div></div>
    <div class="subtitle">A workshop journal</div>

    <div class="progress-wrap">
      <div class="progress-label"><span>Progress</span><span id="progressText">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="toolbar">
      <button id="btnExport" title="Export your answers">Export</button>
      <button id="btnImport" title="Import a saved file">Import</button>
      <button id="btnReset" title="Clear all answers">Reset</button>
    </div>
    <input type="file" id="fileInput" accept=".json" style="display:none">

    <nav id="nav"></nav>
    <div class="acct" id="acct"></div>
  </aside>

  <main class="main" id="main"></main>
</div>

<script>
/* ============================================================
   BOOK CONTENT — The Frequency Effect by ALT
   Chapter structure extracted from the book's table of contents,
   workshop questions transcribed verbatim where they appear,
   supplemented with reflection prompts inspired by chapter teachings.
   ============================================================ */

const BOOK = {
  title: "The Frequency Effect",
  subtitle: "The invisible force behind thought, emotion, and reality",
  sections: [
    {
      id: "s1",
      title: "Section I: Awareness of the Field",
      chapters: [
        {
          id: "s1c1", title: "Metaphysical Biology",
          subtitle: "You Are the Biology",
          tagline: "Set the frequency. Initiate the signal.",
          summary: [
            "Your body is surrounded by an electromagnetic field that responds to feeling. Feeling creates frequency, and frequency sends instruction.",
            "Your heart is the central generator — its electromagnetic field is 60 times stronger than the brain's. Your nervous system doesn't distinguish between imagined and real; it only responds to signal."
          ],
          groups: [{
            header: "Clarify your internal baseline:",
            questions: [
              { id: "q1", text: "What emotional state are you currently operating from?" },
              { id: "q2", text: "What thoughts or insights come up as you notice this?" }
            ]
          }]
        },
        {
          id: "s1c2", title: "You Are Electromagnetic",
          tagline: "Your field reaches further than your skin.",
          summary: [
            "You do not stop at your skin. The electromagnetic field you emit reaches outward and interacts with everything in range — long before you speak or act."
          ],
          groups: [{

function showAuth(){ document.getElementById("authwrap").classList.add("show"); document.querySelector(".app").style.display="none"; }
function hideAuth(){ document.getElementById("authwrap").classList.remove("show"); }
function authMsg(t,ok){ const el=document.getElementById("auth_msg"); el.className="authmsg"+(t?(ok?" ok":" err"):""); el.textContent=t||""; }
function authToggle(){
  AUTH_MODE = AUTH_MODE==="signin"?"signup":"signin";
  const su = AUTH_MODE==="signup";
  document.getElementById("auth_title").textContent = su?"Create your account":"Welcome back";
  document.getElementById("auth_sub").textContent = su?"Start tuning your field. Your reflections sync across every device.":"Sign in to continue. Your reflections sync across every device.";
  document.getElementById("auth_submit").textContent = su?"Create account":"Sign in";
  document.getElementById("auth_pw").setAttribute("autocomplete", su?"new-password":"current-password");
  document.getElementById("auth_switch").innerHTML = su?'Already have an account? <a onclick="authToggle()">Sign in</a>':'New here? <a onclick="authToggle()">Create an account</a>';
  authMsg("");
}
function fbErr(e){
  const c=(e&&e.code)||"";
  if(c.indexOf("email-already-in-use")>=0) return "That email already has an account — try signing in.";
  if(c.indexOf("invalid-email")>=0) return "That doesn't look like a valid email.";
  if(c.indexOf("weak-password")>=0) return "Password should be at least 6 characters.";
  if(c.indexOf("wrong-password")>=0||c.indexOf("invalid-credential")>=0) return "Incorrect email or password.";
  if(c.indexOf("user-not-found")>=0) return "No account with that email yet — create one below.";
  if(c.indexOf("too-many-requests")>=0) return "Too many attempts. Please wait a moment.";
  if(c.indexOf("popup-closed")>=0||c.indexOf("cancelled-popup")>=0) return "Sign-in was cancelled.";
  if(c.indexOf("popup-blocked")>=0) return "Your browser blocked the popup — allow popups and try again.";
  if(c.indexOf("operation-not-allowed")>=0) return "This sign-in method isn't enabled yet in Firebase.";
  return (e&&e.message)||"Something went wrong. Please try again.";
}
async function authSubmit(){
  const email=document.getElementById("auth_email").value.trim();
  const pw=document.getElementById("auth_pw").value;
  if(!email||!pw){ authMsg("Enter your email and password."); return; }
  const btn=document.getElementById("auth_submit"); btn.disabled=true; btn.textContent="Please wait…";
  try{
    if(AUTH_MODE==="signup") await fbAuth.createUserWithEmailAndPassword(email,pw);
    else await fbAuth.signInWithEmailAndPassword(email,pw);
  }catch(e){ authMsg(fbErr(e)); }
  btn.disabled=false; btn.textContent = AUTH_MODE==="signup"?"Create account":"Sign in";
}
async function googleSignIn(){
  try{ const provider=new firebase.auth.GoogleAuthProvider(); await fbAuth.signInWithPopup(provider); }
  catch(e){ authMsg(fbErr(e)); }
}
async function signOut(){ try{ await cloudSave(); }catch(e){} try{ await fbAuth.signOut(); }catch(e){} CURRENT_USER=null; location.reload(); }

/* ----- boot ----- */
async function bootApp(user){
  if(BOOTED) return; BOOTED=true;
  CURRENT_USER=user;
  const c=loadCache(); answers=c.answers||{}; currentChapterId=c.current||null;
  if(fbDb){
    try{
      const snap=await userDoc().get();
      if(snap.exists && snap.data() && snap.data().data){
        const d=snap.data().data; answers=d.answers||{}; currentChapterId=d.current||currentChapterId||null;
      } else {
        await userDoc().set({data:{answers:answers,current:currentChapterId}, email:user.email||null, updatedAt:new Date().toISOString()},{merge:true});
      }
      setSync("saved");
    }catch(e){ setSync("off"); }
  }
  hideAuth(); initApp();
}
function boot(){
  if(LOCAL_MODE){ const c=loadCache(); answers=c.answers||{}; currentChapterId=c.current||null; hideAuth(); initApp(); return; }
  if(!window.firebase || !firebase.initializeApp){ showAuth(); authMsg("Could not load Firebase. Check your connection and refresh."); return; }
  try{ firebase.initializeApp(CONFIG); fbAuth=firebase.auth(); fbDb=firebase.firestore(); }
  catch(e){ showAuth(); authMsg("Firebase config looks off."); return; }
  showAuth();
  fbAuth.onAuthStateChanged(function(user){
    if(user){ if(!BOOTED) bootApp(user); }
    else { if(BOOTED){ CURRENT_USER=null; BOOTED=false; location.reload(); } else showAuth(); }
  });
}
function initApp(){
  document.querySelector(".app").style.display="grid";
  renderAcct();
  renderNav();
  if(currentChapterId && getChapter(currentChapterId)) selectChapter(currentChapterId);
  else renderWelcome();
  document.getElementById("btnExport").onclick = exportAnswers;
  document.getElementById("btnReset").onclick = resetAll;
  document.getElementById("btnImport").onclick = () => document.getElementById("fileInput").click();
  document.getElementById("fileInput").onchange = e => { if (e.target.files[0]) importAnswers(e.target.files[0]); };
}


const STORAGE_KEY = "frequency_effect_workbook_v1";
let answers = {};
let currentChapterId = null;

function loadAnswers() {
  const c = loadCache(); answers = c.answers || {};
}

function saveAnswers() {
  cacheSave();
  dirty = true;
  const ind = document.getElementById("saveIndicator");
  if (ind) { ind.classList.add("show"); clearTimeout(saveAnswers._t); saveAnswers._t = setTimeout(() => ind.classList.remove("show"), 1200); }
  scheduleCloud();
}

function getAllChapters() {
  const out = [];
  BOOK.sections.forEach(s => s.chapters.forEach(c => out.push({ section: s, chapter: c })));
  return out;
}

function getChapter(id) {
  for (const s of BOOK.sections) for (const c of s.chapters) if (c.id === id) return c;
  return null;
}

function chapterStatus(chapter) {
  const ans = answers[chapter.id] || {};
  let total = 0, filled = 0;
  chapter.groups.forEach(g => g.questions.forEach(q => {
    total++;
    if ((ans[q.id] || "").trim().length > 0) filled++;
  }));
  if (total === 0) return "empty";
  if (filled === 0) return "empty";
  if (filled === total) return "done";
  return "partial";
}

function overallProgress() {
  let total = 0, filled = 0;
  getAllChapters().forEach(({ chapter }) => {
    chapter.groups.forEach(g => g.questions.forEach(q => {
      total++;
      const v = ((answers[chapter.id] || {})[q.id] || "").trim();
      if (v.length > 0) filled++;
    }));
  });
  return total === 0 ? 0 : Math.round((filled / total) * 100);
}

function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  BOOK.sections.forEach(section => {
    const sec = document.createElement("div");
    sec.className = "nav-section";
    const title = document.createElement("div");
    title.className = "nav-section-title";
    title.textContent = section.title;
    sec.appendChild(title);
    section.chapters.forEach(ch => {
      const item = document.createElement("div");
      item.className = "nav-item" + (ch.id === currentChapterId ? " active" : "");
      const status = chapterStatus(ch);
      if (status === "done") item.classList.add("done");
      else if (status === "partial") item.classList.add("partial");
      item.innerHTML = `<span>${ch.title}</span><span class="dot" title="${status}"></span>`;
      item.onclick = () => selectChapter(ch.id);
      sec.appendChild(item);
    });
    nav.appendChild(sec);
  });

  document.getElementById("progressText").textContent = overallProgress() + "%";
  document.getElementById("progressFill").style.width = overallProgress() + "%";
}

function renderChapter(id) {
  const ch = getChapter(id);
  const section = BOOK.sections.find(s => s.chapters.some(c => c.id === id));
  const main = document.getElementById("main");

  let html = `
    <div class="ch-section">${section.title}</div>
    <h1 class="ch-title">${ch.title}</h1>
    ${ch.subtitle ? `<div class="ch-tagline">${ch.subtitle}</div>` : ""}
    ${ch.tagline ? `<div class="ch-tagline">${ch.tagline}</div>` : ""}
    ${WAVE}
    <div class="ch-summary">${(ch.summary || []).map(p => `<p>${escapeHtml(p)}</p>`).join("")}</div>
  `;

  (ch.groups || []).forEach(group => {
    html += `<div class="prompt-group">`;
    if (group.header) html += `<div class="prompt-group-header">${escapeHtml(group.header)}</div>`;
    if (group.helper) html += `<div class="q-helper">${escapeHtml(group.helper)}</div>`;
    group.questions.forEach(q => {
      const saved = (answers[ch.id] || {})[q.id] || "";
      html += `
        <div class="question">
          <div class="q-text">${escapeHtml(q.text)}</div>
          ${q.helper ? `<div class="q-helper">${escapeHtml(q.helper)}</div>` : ""}
          <textarea data-chapter="${ch.id}" data-q="${q.id}" placeholder="Write your reflection…">${escapeHtml(saved)}</textarea>
        </div>
      `;
    });
    html += `</div>`;
  });

  // Bottom nav
  const all = getAllChapters();
  const idx = all.findIndex(x => x.chapter.id === id);
  const prev = idx > 0 ? all[idx - 1].chapter : null;
  const next = idx < all.length - 1 ? all[idx + 1].chapter : null;
  html += `
    <div class="nav-bottom">
      <button id="prevBtn" ${prev ? "" : "disabled"}>${prev ? "← " + prev.title : "← Start"}</button>
      <button id="nextBtn" ${next ? "" : "disabled"}>${next ? next.title + " →" : "End →"}</button>
    </div>
  `;

  main.innerHTML = html;

  // Wire up textareas with autosave
  main.querySelectorAll("textarea").forEach(ta => {
    ta.addEventListener("input", e => {
      const cid = e.target.dataset.chapter;
      const qid = e.target.dataset.q;
      if (!answers[cid]) answers[cid] = {};
      answers[cid][qid] = e.target.value;
      scheduleSave();
    });
    // Auto-resize on input
    ta.addEventListener("input", autoResize);
    autoResize.call(ta);
  });

  if (prev) document.getElementById("prevBtn").onclick = () => selectChapter(prev.id);
  if (next) document.getElementById("nextBtn").onclick = () => selectChapter(next.id);

  window.scrollTo(0, 0);
}

let _saveTimer = null;
function scheduleSave() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    saveAnswers();
    renderNav();
  }, 400);
}

function autoResize() {
  this.style.height = "auto";
  this.style.height = Math.max(90, this.scrollHeight + 4) + "px";
}

function selectChapter(id) {
  currentChapterId = id;
  cacheSave();
  dirty = true;
  scheduleCloud();
  renderNav();
  renderChapter(id);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function exportAnswers() {
  const data = {
    book: BOOK.title,
    exported: new Date().toISOString(),
    answers
  };
  // JSON download
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "frequency-effect-workbook.json";
  a.click();
  URL.revokeObjectURL(url);

  // Also download a readable text version
  let txt = `THE FREQUENCY EFFECT — Companion Workbook\nExported: ${new Date().toLocaleString()}\n\n`;
  BOOK.sections.forEach(section => {
    txt += `\n========================================\n${section.title.toUpperCase()}\n========================================\n`;
    section.chapters.forEach(ch => {
      txt += `\n--- ${ch.title} ---\n`;
      if (ch.tagline) txt += ch.tagline + "\n";
      ch.groups.forEach(g => {
        if (g.header) txt += `\n${g.header}\n`;
        g.questions.forEach(q => {
          const a = ((answers[ch.id] || {})[q.id] || "").trim();
          txt += `\nQ: ${q.text}\n`;
          txt += a ? `A: ${a}\n` : `A: (not yet answered)\n`;
        });
      });
    });
  });
  const tblob = new Blob([txt], { type: "text/plain" });
  const turl = URL.createObjectURL(tblob);
  const ta = document.createElement("a");
  ta.href = turl;
  ta.download = "frequency-effect-workbook.txt";
  ta.click();
  URL.revokeObjectURL(turl);
}

function importAnswers(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.answers) {
        answers = data.answers;
        saveAnswers();
        renderNav();
        if (currentChapterId) renderChapter(currentChapterId);
        alert("Imported successfully.");
      } else { alert("File doesn't look right — no answers found."); }
    } catch(err) { alert("Couldn't read that file: " + err.message); }
  };
  reader.readAsText(file);
}

function resetAll() {
  if (!confirm("Erase all of your answers? This can't be undone.")) return;
  answers = {};
  cacheSave();
  dirty = true;
  cloudSave();
  renderNav();
  if (currentChapterId) renderChapter(currentChapterId); else renderWelcome();
}

function renderWelcome() {
  document.getElementById("main").innerHTML = `
    <div class="welcome">
      <div class="hero-mark">${LOGO_LG}</div>
      <div class="ch-section">Companion Workbook</div>
      <h2>The Frequency Effect</h2>
      <p>${escapeHtml(BOOK.subtitle)}</p>
      <p style="margin-top:18px;">A private space to work through the book chapter by chapter. Each chapter distills its core teaching and gives you the reflection questions from the workshop pages. Your reflections sync securely to your account, across every device.</p>
      <button class="btn-begin" onclick="selectChapter('s1c1')">Begin with Chapter 1 →</button>
    </div>
  `;
}

/* Init */
boot();
</script>
