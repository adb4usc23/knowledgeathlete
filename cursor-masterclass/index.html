<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cursor Masterclass</title>
<meta name="description" content="A hands-on masterclass for getting started with Cursor, with real screenshots, guided projects, and quizzes.">
<style>
:root{
  --bg:#f5f2ea; --panel:#fbfaf6; --ink:#16181b; --muted:#666a70; --line:#dedacd;
  --accent:#d8432a; --accent-ink:#fff; --soft:#f0e9d9; --ok:#1f7a4d; --okbg:#e3f1e8;
  --warn:#8a5a00; --warnbg:#fbf0d4; --code:#ece7d9; --shadow:0 1px 2px rgba(20,20,20,.06),0 12px 32px -12px rgba(20,20,20,.18);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121315; --panel:#191b1e; --ink:#ecebe6; --muted:#9a9da3; --line:#2c2f34;
  --accent:#ff6a4d; --accent-ink:#17110f; --soft:#22252a; --ok:#6fd3a0; --okbg:#17281f;
  --warn:#f0c264; --warnbg:#2b2413; --code:#23262b; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#121315; --panel:#191b1e; --ink:#ecebe6; --muted:#9a9da3; --line:#2c2f34;
  --accent:#ff6a4d; --accent-ink:#17110f; --soft:#22252a; --ok:#6fd3a0; --okbg:#17281f;
  --warn:#f0c264; --warnbg:#2b2413; --code:#23262b; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
kbd{font:600 .8em var(--mono);background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:.1em .45em;white-space:nowrap}
code{font:.88em var(--mono);background:var(--code);padding:.12em .38em;border-radius:4px}

/* layout */
.app{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:22px 16px 28px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0 6px;text-align:left}
.brand .mark{width:30px;height:30px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 15px var(--mono)}
.brand b{font:600 1.05rem var(--serif);letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.meter{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.meter .row{display:flex;justify-content:space-between;align-items:baseline;font-size:.82rem;color:var(--muted)}
.meter .row b{font:600 1.5rem var(--serif);color:var(--ink)}
.bar{height:6px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.nav h5{margin:14px 8px 6px;font:600 .7rem var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.nav button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;font-size:.9rem;line-height:1.35}
.nav button:hover{background:var(--soft)}
.nav button.on{background:var(--ink);color:var(--bg)}
.dot{flex:none;width:17px;height:17px;margin-top:1px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:10px;line-height:1}
.done .dot{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.done .dot::after{content:"✓"}
.nav button.quiz .dot{border-radius:4px}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:.8rem;color:var(--muted)}
.sidefoot button{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.82rem;text-align:left}
.sidefoot button:hover{border-color:var(--ink)}
.who{padding:0 4px}

main{min-width:0}
.top{display:none;position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;align-items:center;gap:12px}
.top button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.top .bar{flex:1;margin:0}
.page{max-width:820px;margin:0 auto;padding:56px 32px 96px}
.eyebrow{font:600 .74rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font:600 clamp(2rem,4.6vw,3.1rem)/1.1 var(--serif);margin:.3em 0 .35em;letter-spacing:-.01em;text-wrap:balance}
h2{font:600 1.6rem/1.2 var(--serif);margin:0 0 .3em}
h3{font:600 1.28rem/1.25 var(--serif);margin:2.1em 0 .5em}
h4{font:600 1rem var(--sans);margin:0 0 .3em}
.meta{color:var(--muted);font-size:.88rem;display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.lede{font:1.18rem/1.6 var(--serif);color:var(--ink)}
.small{font-size:.86rem;color:var(--muted)}
ul,ol{padding-left:1.25em}
li{margin:.35em 0}

/* hero */
.hero{border-bottom:1px solid var(--line);padding-bottom:34px;margin-bottom:34px}
.hero p{font:1.2rem/1.6 var(--serif);max-width:60ch;color:var(--muted)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 20px;font-weight:650;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.btn:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:30px 0 0}
.stats div{background:var(--panel);padding:14px 16px}
.stats b{display:block;font:600 1.5rem var(--serif)}
.stats span{font-size:.78rem;color:var(--muted)}
.mods{display:grid;gap:12px}
.mod{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;width:100%}
.mod:hover{border-color:var(--ink);box-shadow:var(--shadow)}
.mod .n{font:600 2rem var(--serif);color:var(--accent);width:1.4em}
.mod p{margin:.15em 0 0;color:var(--muted);font-size:.92rem}
.mod .pc{font:600 .8rem var(--mono);color:var(--muted)}

/* lesson blocks */
.shot{margin:26px 0}
.shot.narrow .frame{display:inline-block;max-width:100%}.shot.narrow img{width:auto;max-width:100%}
.frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--shadow);cursor:zoom-in}
.frame img{display:block;width:100%;height:auto}
figcaption{font-size:.86rem;color:var(--muted);margin-top:9px;padding-left:12px;border-left:2px solid var(--accent)}
.steps{counter-reset:s;list-style:none;padding:0;margin:18px 0}
.steps li{counter-increment:s;position:relative;padding:10px 0 10px 46px;border-top:1px solid var(--line);margin:0}
.steps li:last-child{border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);position:absolute;left:4px;top:10px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 .82rem var(--mono)}
.prompt{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:16px 0;background:var(--panel)}
.prompt-h{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;border-bottom:1px solid var(--line);font:600 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.copy{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 10px;font:600 .72rem var(--sans);letter-spacing:0;text-transform:none}
.copy:hover{border-color:var(--ink)}
.prompt pre{margin:0;padding:14px;font:.9rem/1.55 var(--mono);white-space:pre-wrap;word-break:break-word}
.note{border-radius:12px;padding:14px 16px;margin:20px 0;background:var(--okbg);border:1px solid transparent}
.note b{font:600 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ok)}
.note p{margin:.25em 0 0}
.note.warn{background:var(--warnbg)}.note.warn b{color:var(--warn)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.cols.three{grid-template-columns:repeat(3,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card p{margin:0;font-size:.92rem;color:var(--muted)}
.tablewrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--panel)}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}
.loop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0}
.loop span{background:var(--ink);color:var(--bg);border-radius:99px;padding:6px 16px;font:600 .85rem var(--mono)}
.loop i{color:var(--muted);font-style:normal}
details.coder{border:1px dashed var(--line);border-radius:12px;padding:0 16px;margin:20px 0;background:var(--panel)}
details.coder summary{cursor:pointer;padding:12px 0;font:600 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
details.coder[open]{padding-bottom:12px}
pre.code{background:var(--code);border-radius:10px;padding:14px;font:.84rem/1.55 var(--mono);overflow-x:auto;white-space:pre}
.next{display:block;border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:var(--panel);margin-top:28px;text-decoration:none;color:var(--ink)}
.next:hover{border-color:var(--ink)}.next b{font:600 1.1rem var(--serif)}.next span{display:block;color:var(--muted);font-size:.9rem}

.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:48px;padding-top:24px;border-top:1px solid var(--line)}
.btn.done-btn.is{background:var(--okbg);color:var(--ok)}

/* quiz */
.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0}
.q h4{font:600 1.05rem/1.4 var(--serif);margin-bottom:12px}
.q label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer}
.q label:hover{border-color:var(--ink)}
.q input{margin-top:5px;accent-color:var(--accent)}
.q label.right{background:var(--okbg);border-color:var(--ok)}
.q label.wrong{background:var(--warnbg);border-color:var(--warn)}
.q .why{display:none;font-size:.9rem;color:var(--muted);margin-top:10px}
.q.graded .why{display:block}
.result{border-radius:14px;padding:20px;margin:20px 0;background:var(--okbg);display:none}
.result.show{display:block}.result.fail{background:var(--warnbg)}
.result b{font:600 1.5rem var(--serif)}
.cert{text-align:center;border:1px solid var(--line);border-radius:18px;padding:44px 24px;background:var(--panel);box-shadow:var(--shadow);margin:24px 0}
.cert h2{font-size:2rem}

.lightbox{position:fixed;inset:0;background:rgba(10,10,10,.86);display:none;place-items:center;z-index:50;padding:20px;cursor:zoom-out}
.lightbox.show{display:grid}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}
.scrim{display:none}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;z-index:20;width:min(320px,86vw);transform:translateX(-102%);transition:transform .25s}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}
  .top{display:flex}
  .page{padding:32px 16px 72px}
  .cols,.cols.three{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .mod{grid-template-columns:auto 1fr}.mod .pc{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

</div>

/* Cursor Masterclass content. fig(name, caption) inserts a real screenshot. */
const fig = (n, cap, cls = "") =>
  `<figure class="shot ${cls}"><div class="frame"><img loading="lazy" src="${IMG[n]}" alt="${cap.replace(/<[^>]+>/g, "").replace(/"/g, "&quot;")}"></div><figcaption>${cap}</figcaption></figure>`;
const prompt = (t) =>
  `<div class="prompt"><div class="prompt-h"><span>Prompt</span><button class="copy" type="button">Copy</button></div><pre>${t}</pre></div>`;
const tip = (t) => `<aside class="note"><b>Tip</b><p>${t}</p></aside>`;
const warn = (t) => `<aside class="note warn"><b>Heads up</b><p>${t}</p></aside>`;
const steps = (a) => `<ol class="steps">${a.map((s) => `<li>${s}</li>`).join("")}</ol>`;
const kbd = (k) => `<kbd>${k}</kbd>`;

          body: `
<p class="lede">Cursor is a code editor with an AI agent built in. You describe what you want in plain English, the agent reads your files, writes the changes, and shows you exactly what it changed so you can keep or undo it.</p>
<p>You do not need to be a programmer to start. You do need to be willing to read what the agent did and say yes or no. That habit is the whole skill, and this masterclass is built around it.</p>
<h3>Two windows, one app</h3>
<p>Cursor today opens in two different windows. Knowing which one you are in saves a lot of confusion.</p>
<div class="cols">
  <div class="card"><h4>Agents window</h4><p>A clean chat screen. You pick a project, type a request, and manage several agent conversations at once. Best for starting work and delegating.</p></div>
  <div class="card"><h4>IDE window</h4><p>The classic editor: files on the left, code in the middle, the agent panel on the right. Best for reading code and reviewing changes line by line.</p></div>
</div>
${fig("home", "The Agents window. A prompt box in the middle, your conversations and projects on the left.")}
${fig("ide-full", "The IDE window with a project open: file explorer, a live preview of the page, and the agent panel.")}
<p>You can jump between them at any time. The Agents window has an <b>IDE</b> button in its top right corner, and the IDE has <b>Switch to Agents Window</b> in its File menu.</p>
<h3>What you will build</h3>
<p>You will work on a small practice project with three files: a plain web page you will redesign, a tip calculator with a real bug to fix, and a sales spreadsheet to turn into a dashboard. Every screenshot in this course comes from running those exact exercises.</p>

          body: `
<p class="lede">Time to build something. You will ask the agent to turn a plain page into a real landing page, with one sentence.</p>
<h3>Before</h3>
<p>Open <code>index.html</code> from the explorer. It is a heading, one paragraph, and a three item list. No styling at all.</p>
<h3>Ask</h3>
${steps([
  "Click the <b>+</b> at the top of the agent panel to start a new chat.",
  "Check that the mode menu at the bottom left of the prompt box is set to <b>Agent</b>.",
  `Paste the prompt below and press ${kbd("Enter")}.`,
])}
${prompt("Redesign index.html into a modern personal landing page with a hero section, three project cards, and a contact section. Keep it to one HTML file.")}
<h3>Watch</h3>
<p>The agent reads the file, writes a new version, and then does something a chatbot cannot: it opens the page in a built in browser and checks its own work. In our run it reported that the buttons scrolled to the right sections and that the cards stacked correctly on a narrow screen.</p>
${fig("ide-full", "The result. The redesigned page is previewed in the middle, and the agent's summary is on the right.")}
<h3>What made that prompt work</h3>
<ul>
<li><b>It names the file.</b> The agent knows exactly where to work.</li>
<li><b>It lists the parts.</b> Hero, three cards, contact. Specific beats vague.</li>
<li><b>It sets a limit.</b> “Keep it to one HTML file” stops the agent from creating a pile of extra files.</li>
</ul>
${tip("Your page will not look identical to ours. The agent makes design choices each time. That is normal, and it is why the next lesson on reviewing changes matters.")}`,

          id: "l6",
          title: "Review changes: Keep or Undo",
          mins: 7,
          body: `
<p class="lede">Nothing the agent writes is final until you say so. Reviewing is the most important habit in this course.</p>
<h3>The review bar</h3>
<p>When the agent finishes, a small bar appears above the prompt box. It tells you how many files changed and gives you three choices.</p>
${fig("agent-panel", "The bar reads <b>1 File</b> with <b>Undo</b>, <b>Keep</b>, and <b>Review</b>.", "narrow")}
<ul>
<li><b>Review</b> walks you through each change.</li>
<li><b>Keep</b> accepts everything.</li>
<li><b>Undo</b> throws the changes away and restores your files.</li>
</ul>
<h3>Reading a diff</h3>
<p>Open the changed file from the explorer. Cursor shows the old and new versions together. This view is called a diff.</p>
${fig("diff-index", "The diff for <code>index.html</code>. Red lines were removed. Green lines were added.")}
<ul>
<li><b>Red</b> is what was there before.</li>
<li><b>Green</b> is what the agent wrote.</li>
<li>The counter at the top (here <b>1 of 2</b>) steps through each block of changes.</li>
<li><b>Keep File</b> and <b>Undo File</b> at the top decide the whole file at once.</li>
</ul>
<p>You can also decide block by block. Each changed block has its own small <b>Undo</b> and <b>Keep</b> buttons, with shortcuts ${kbd("⌘")} ${kbd("N")} and ${kbd("⌘")} ${kbd("Y")} on Mac.</p>
<h3>A simple review routine</h3>
${steps([
  "Look at the result first. Does the page do what you asked?",
  "Skim the diff. You are not checking every character. You are checking that the agent only touched what you expected.",
  "If something is off, say so in the chat and let the agent fix it. If it is badly off, click <b>Undo</b> and write a clearer prompt.",
  "When you are satisfied, click <b>Keep</b>.",
])}
${warn("Do not skip review because the result looks right. In the next lessons the agent edits logic, where a change can look fine and still be wrong.")}`,

          body: `
<p class="lede">For anything bigger than a one line change, ask for a plan first. Plan mode makes the agent think and write down its approach without touching your files.</p>
<h3>Switch to Plan mode</h3>
${steps([

<p class="small">In the Agents window, the <b>Start with a plan</b> starter does the same thing.</p>
<h3>Read the plan</h3>
<p>Instead of code, you get a document. Cursor saves it as a <code>.plan.md</code> file and opens it in the editor.</p>
${fig("plan", "The plan for our dark mode toggle: an approach in four parts, a clear scope, and a to-do list at the bottom.")}
<p>Notice what a good plan contains:</p>
<ul>
<li><b>Approach.</b> The steps the agent intends to take, in order.</li>
<li><b>Scope.</b> Which files it will change, and which it will leave alone. Ours says <code>index.html</code> only.</li>
<li><b>To-dos.</b> A checklist the agent will work through.</li>
</ul>
<h3>Change it, then build</h3>
<p>The plan is just a document, so you can push back. Reply in the chat with something like “use a sun and moon icon instead of text” and the plan updates. When you agree with it, click <b>Build</b> at the top of the plan and the agent carries it out.</p>

          body: `
<p class="lede">The tip calculator in the practice project is broken on purpose. You will describe the symptom and let the agent find the cause.</p>
<h3>See the problem</h3>
<p>The calculator starts with a bill of $80, a 20% tip, and 4 people. Each person should pay $24.00. Out of the box, it shows something very different.</p>
<h3>Describe the symptom, not the fix</h3>
<p>Switch the mode menu back to <b>Agent</b>, start a new chat, and send this:</p>
${prompt("tip-calculator.html shows the wrong amount. $80 with a 20% tip split 4 ways should be $24.00 each. Find the bug in tip.js and fix it.")}
<p>This is a strong bug report for three reasons. It says <b>where</b> the problem shows up, gives a <b>concrete example</b> with the right answer, and names the <b>file to look in</b>.</p>
<h3>What the agent found</h3>
${fig("diff-tip", "The fix in <code>tip.js</code>. Three separate changes, shown as red and green lines.")}
<p>The agent found the bug we planted and two more problems we had not mentioned:</p>
<ol>
<li><b>The planted bug.</b> The tip was calculated as <code>bill * tipPercent</code>, which treats 20 as 2000%. It now divides by 100.</li>
<li><b>Text instead of numbers.</b> Values typed into a form arrive as text, so adding them glued them together. The agent wrapped each one in <code>Number()</code>.</li>
<li><b>Formatting.</b> The result now shows two decimal places with <code>toFixed(2)</code>.</li>
</ol>
<h3>Confirm it yourself</h3>
<p>Open the calculator in the preview and click Calculate.</p>
${fig("tip-fixed", "After the fix: each person pays $24.00.")}
${warn("The agent fixed more than you asked for. Here that was helpful. On a real project, extra changes can break something else, so always read the whole diff, not only the line you expected.")}`,

          body: `
<p class="lede">The agent is only as good as what it knows. Two characters in the prompt box control that: ${kbd("@")} and ${kbd("/")}.</p>
<h3>@ points at things</h3>
<p>Type ${kbd("@")} and start typing a file name. Pick the file from the list and it is attached to your request. Use it whenever your request is about a particular file.</p>
${prompt("Explain what @tip.js does, one line at a time, for someone new to JavaScript.")}
<p>Without the <code>@</code>, the agent has to go looking, and it may look in the wrong place.</p>
<h3>/ calls a skill</h3>
<p>A skill is a packaged set of instructions for a specific kind of job. Type ${kbd("/")} to see the ones you have. One built in example is <code>/canvas</code>, which builds an interactive dashboard from data.</p>
${fig("starter-canvas", "The <b>Create a dashboard</b> starter writes the <code>/canvas</code> command for you.", "narrow")}
<p>Combine both to turn the sample sales data into a dashboard:</p>
${prompt("/canvas Help me analyze data in the attached CSV: @sales.csv Show revenue by month and by region.")}
${warn("Canvas requests are heavy. On our free account this request used up the remaining allowance before it finished. Try it early in your usage period, or on a paid plan.")}
<h3>Three habits for better context</h3>
<ul>
<li><b>One job per chat.</b> Start a new chat for each new task. Old conversation is noise.</li>
<li><b>Show an example.</b> “Should be $24.00” told the agent more than “it is wrong” ever could.</li>
<li><b>Say what to leave alone.</b> “Only change index.html” is a complete and useful instruction.</li>
</ul>`,

          mins: 6,
          body: `
<p class="lede">Not every change needs a conversation. For small edits while you are typing, Cursor has a faster tool called Tab.</p>
<h3>How Tab works</h3>
<p>As you type in the editor, Cursor predicts what comes next and shows it in gray text. Press ${kbd("Tab")} to accept it. Keep typing to ignore it. It often predicts several lines at once, and it learns from the edits you just made.</p>
<h3>Try it</h3>
${steps([
  "Open <code>tip.js</code>.",
  `On a new line at the bottom, type <code>// function to calculate the total with tax</code> and press ${kbd("Enter")}.`,
  `Wait a moment. A gray suggestion should appear. Press ${kbd("Tab")} to accept it.`,
  `Do not like it? Press ${kbd("Esc")} or just keep typing.`,
])}
<h3>Tab settings</h3>
${fig("settings-tab", "Settings &rarr; Tab. <b>Cursor Tab</b> turns the feature on or off. <b>Partial Accepts</b> lets you take one word at a time.")}
<ul>
<li><b>Cursor Tab.</b> The main switch.</li>
<li><b>Partial Accepts.</b> Accept only the next word of a suggestion with ${kbd("⌘")} ${kbd("→")}.</li>
<li><b>Suggestions While Commenting.</b> Whether Tab helps you write comments too.</li>
<li><b>Ignored Files.</b> File types where you never want suggestions.</li>
</ul>
<h3>Inline edits</h3>
<p>For a change to one spot, select the lines in the editor and press ${kbd("⌘")} ${kbd("K")} (${kbd("Ctrl")} ${kbd("K")} on Windows). A small box appears right in the code. Type what you want, such as “add a comment explaining this line”, and the change is proposed in place as a diff.</p>
<div class="tablewrap"><table>
<thead><tr><th>Use</th><th>When</th></tr></thead>
<tbody>
<tr><td><b>Tab</b></td><td>You are typing and want the next few lines finished</td></tr>
<tr><td><b>Inline edit</b></td><td>You want to change one specific block you can point at</td></tr>
<tr><td><b>Agent</b></td><td>The change spans files, needs investigation, or you cannot point at where it goes</td></tr>
</tbody></table></div>`,

          title: "Rules, Skills, and connections",
          mins: 8,
          body: `
<p class="lede">Out of the box, the agent knows nothing about how <i>you</i> like to work. Customize is where you teach it.</p>
${fig("customize", "Customize, opened from the Agents window sidebar. The tabs across the top are the different ways to extend Cursor.")}
<h3>Rules: standing instructions</h3>
<p>A rule is an instruction the agent follows in every conversation, so you do not have to repeat yourself.</p>
${fig("rules", "The Rules tab. Click <b>New</b> to write your first rule.")}
<p>Good first rules are short and specific:</p>
${prompt("Explain every change in plain English before making it. Assume I am new to coding.")}
${prompt("Only edit files I mention by name. Ask before creating new files.")}
${prompt("Use plain HTML, CSS, and JavaScript. Do not add frameworks or build tools.")}
<h3>Skills: packaged know-how</h3>
<p>A skill teaches the agent how to do one kind of job well. You call a skill with ${kbd("/")} in the prompt box, as you did with <code>/canvas</code>. Skills you install or write appear in a list.</p>
${fig("skills", "The Skills tab with a set of installed skills. Each has a name and a short description of when to use it.")}
<h3>The other tabs</h3>
<div class="tablewrap"><table>
<thead><tr><th>Tab</th><th>What it is</th></tr></thead>
<tbody>
<tr><td><b>Plugins</b></td><td>Bundles of rules, skills, subagents, commands, MCP servers, and hooks in one installable package</td></tr>
<tr><td><b>MCPs</b></td><td>Connections that let the agent use outside tools and services</td></tr>
<tr><td><b>Subagents</b></td><td>Helper agents the main agent can hand work to</td></tr>
<tr><td><b>Commands</b></td><td>Saved prompts you can reuse</td></tr>
<tr><td><b>Hooks</b></td><td>Actions that run automatically at set moments</td></tr>
</tbody></table></div>
${tip("Start with two or three rules and nothing else. Add skills and connections only when you notice yourself repeating the same instructions.")}
${warn("Plugins, skills, and MCP connections can run code and reach outside services. Install them only from sources you trust, the same way you would treat any app.")}`,

<h3>The model picker</h3>
<p>The model name sits at the bottom of the prompt box. Click it to switch. On the free plan it is locked to Cursor's default.</p>
${fig("model-locked", "On the free plan, clicking the model name shows this notice instead of a list.", "narrow")}
${fig("settings-models", "Settings &rarr; Models. Switch on the models you want to see in the picker.")}
<p>You do not need to study models to get started. A sensible approach: stay on the default, and try a stronger model only when the default gets stuck on a hard problem.</p>
<h3>Usage limits</h3>
<p>Every plan has a usage allowance. When it runs out, Cursor tells you in the agent panel.</p>
${fig("usage-limit", "The limit notice from our own session. It appeared partway through the dashboard request.", "narrow")}
<p>To make an allowance last longer:</p>
<ul>
<li>Write one clear prompt instead of five vague ones.</li>
<li>Use Plan mode so the agent builds the right thing the first time.</li>
<li>Use Tab and inline edits for small changes.</li>
<li>Start a new chat for each task. Long chats cost more per message.</li>
</ul>
<h3>Agent settings worth a look</h3>
${fig("settings-agents", "Settings &rarr; Agents.")}
<ul>
<li><b>Default Model.</b> Which model new chats start with.</li>
<li><b>New Messages.</b> What happens if you send a message while the agent is still working. <b>Queue</b> waits its turn.</li>
<li><b>Auto-Approve Mode Transitions.</b> Leave this off while you are learning, so the agent asks before switching between Plan and other modes.</li>
</ul>
<h3>Automations</h3>
<p>Automations are agents that run on a schedule or in response to events, without you starting them. They need a paid plan.</p>
${fig("automations", "The Automations page on a free account.")}`,
        },
      ],
      quiz: [
        { q: "You are typing and gray text appears suggesting the next line. How do you accept it?", a: ["Press Enter", "Press Tab", "Click Keep", "Press ⌘K"], c: 1, why: "Tab accepts the suggestion. Esc or continuing to type ignores it." },
        { q: "What is a rule in Cursor?", a: ["A keyboard shortcut", "A standing instruction the agent follows in every conversation", "A paid add-on", "A type of file"], c: 1, why: "Rules give the agent persistent instructions so you do not repeat yourself." },
        { q: "Which change is the best fit for Agent rather than Tab or an inline edit?", a: ["Finishing the line you are typing", "Renaming one variable on one line", "A change that touches several files and needs investigation", "Adding a comment to a selected line"], c: 2, why: "Agent is for work that spans files or needs the agent to look around first." },
        { q: "Which habit helps your usage allowance last longer?", a: ["Keeping every task in one very long chat", "Sending many short, vague prompts", "Planning first and writing one clear, specific prompt", "Always choosing the largest model"], c: 2, why: "Clear prompts and Plan mode get it right the first time. Long chats and retries burn allowance." },
      ],
    },
    {
      id: "m4",
      title: "Build and ship",
      blurb: "Three guided projects, then put your work on the internet.",
      lessons: [
        {
          id: "l13",
          title: "Three guided projects",
          mins: 20,
          body: `
<p class="lede">You have seen every core move. Now run them end to end, on your own, three times. Each project uses the same loop: plan, build, review, refine.</p>
<div class="loop"><span>Plan</span><i>&rarr;</i><span>Build</span><i>&rarr;</i><span>Review</span><i>&rarr;</i><span>Refine</span></div>
<h3>Project 1: Your personal landing page</h3>
<p class="small">Skills: Agent, review, follow-up prompts. About 20 minutes.</p>
${steps([
  "Open <code>index.html</code> and run the redesign prompt from Lesson 5.",
  "Review the diff and click <b>Keep</b>.",
  "Make it yours with follow-up prompts in the same chat:",
])}
${prompt("Replace the placeholder name and intro with: [your name], [one sentence about what you do].")}
${prompt("Change the three project cards to these projects: [project 1], [project 2], [project 3]. Write a one sentence description for each.")}
${prompt("Change the accent color to [a color you like] and make sure the text is still easy to read.")}
<p><b>Done when:</b> the page shows your real name and projects, and you kept every change after reading its diff.</p>
<h3>Project 2: Finish the tip calculator</h3>
<p class="small">Skills: debugging, Plan mode, inline edits. About 25 minutes.</p>
${steps([
  "Run the bug fix from Lesson 8 and confirm the result is $24.00.",
  "Switch to <b>Plan</b> mode and ask for the upgrade below. Read the plan before you click Build.",
  `Use an inline edit (${kbd("⌘")} ${kbd("K")}) on one function to add a plain English comment.`,
])}
${prompt("Plan an upgrade to the tip calculator: style it to match index.html, add quick buttons for 15%, 18%, and 20%, and show the total bill as well as the amount per person. Only change tip-calculator.html and tip.js.")}
<p><b>Done when:</b> the calculator matches your landing page and the quick buttons work.</p>
<h3>Project 3: A sales dashboard</h3>
<p class="small">Skills: context with @, skills with /. About 25 minutes. Uses the most allowance.</p>
${steps([
  "Start a new chat in Agent mode.",
  "Send the canvas prompt from Lesson 9.",
  "Ask a follow-up question about the data.",
])}
${prompt("Which region grew faster from January to June, and by how much? Add that as a headline above the charts.")}
<p><b>Done when:</b> you can see revenue by month and region, and you have checked one number against <code>sales.csv</code> yourself.</p>
${tip("That last check matters. Open sales.csv, add up one month by hand, and compare it with the chart. Verifying an AI's numbers is a professional habit, not a beginner step.")}
${warn("If you hit the usage limit on the free plan, stop and come back later. Your work is saved in the project folder.")}`,
        },
        {
          id: "l14",
          title: "Publish with GitHub and Cloudflare",
          mins: 12,
          body: `
<p class="lede">A project on your laptop is practice. A project with a link is a portfolio piece. This lesson gets your landing page online for free.</p>
<h3>The idea</h3>
<p><b>GitHub</b> stores your project and its history. <b>Cloudflare Pages</b> takes what is on GitHub and serves it as a website. After the one-time setup, every change you save to GitHub goes live on its own.</p>
<div class="loop"><span>Your computer</span><i>&rarr;</i><span>GitHub</span><i>&rarr;</i><span>Cloudflare</span><i>&rarr;</i><span>Live link</span></div>
<h3>Part 1: Put the project on GitHub</h3>
${steps([
  "Create a free account at <b>github.com</b> if you do not have one.",
  "On GitHub, create a new empty repository. Name it something like <code>my-landing-page</code>.",
  "Back in Cursor, ask the agent to do the technical part with the prompt below.",
  "The agent will ask permission to run commands in the terminal. Read each one before you approve it. The first time, GitHub will ask you to sign in.",
])}
${prompt("Set up git for this project, make a first commit with all files, and push it to my GitHub repository at [paste your repository URL]. Explain each command before you run it.")}

${steps([

  "In the dashboard, find <b>Workers &amp; Pages</b> and create a new Pages project.",
  "Choose to connect to Git, sign in to GitHub, and pick your repository.",

])}
<p class="small">Cloudflare renames menus from time to time. If a label differs, look for “Pages” and “Connect to Git”.</p>
<h3>Part 3: Update your live site</h3>
<p>From now on, the loop is short. Make a change with the agent, review it, keep it, then send:</p>
${prompt("Commit my changes with a short message describing what changed, and push to GitHub.")}
<p>A minute or so later the live site shows the new version.</p>
${warn("Never put passwords, API keys, or private data in a project you push to a public GitHub repository. If you are unsure, ask the agent: “Is there anything in this project that should not be public?”")}
<h3>You are done</h3>
<p>You can now set up Cursor, ask for work clearly, review what you get, plan bigger changes, fix bugs, shape the agent with rules, and ship a site. Take the final quiz to complete the masterclass.</p>`,
        },
      ],
      quiz: [
        { q: "What is the four-step loop this course recommends for every project?", a: ["Prompt, accept, repeat, ship", "Plan, build, review, refine", "Install, upgrade, prompt, publish", "Write, compile, test, deploy"], c: 1, why: "Plan, build, review, refine is the loop used in every guided project." },
        { q: "The agent built you a dashboard from a spreadsheet. What should you do before sharing it?", a: ["Nothing, AI numbers are always right", "Check at least one number against the original data yourself", "Ask the agent if it is sure", "Switch to a bigger model"], c: 1, why: "Verifying a number by hand against the source is the reliable check." },
        { q: "In the publishing setup, what is each service's job?", a: ["GitHub serves the site, Cloudflare stores the code", "GitHub stores the project and its history, Cloudflare Pages serves it as a website", "Both store backups only", "Cursor hosts the site itself"], c: 1, why: "GitHub holds the code. Cloudflare Pages publishes what is on GitHub." },
        { q: "The agent asks permission to run a terminal command you do not understand. What is the best move?", a: ["Approve it so the work continues", "Ask the agent to explain the command before you approve", "Close Cursor", "Approve it twice"], c: 1, why: "You are responsible for what runs on your computer. Ask for an explanation first." },
        { q: "What should never go into a public GitHub repository?", a: ["HTML files", "A README", "Passwords, API keys, or private data", "Images"], c: 2, why: "Anything pushed to a public repository can be read by anyone." },
      ],
    },
  ],
};

</script>
<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const M = COURSE.meta, KEY = M.key;
  const PASS = 0.75;
  const lessons = COURSE.modules.flatMap((m) => m.lessons.map((l) => ({ ...l, mod: m })));
  const total = lessons.length + COURSE.modules.length;

  /* ---------- storage: local first, optional Firestore ---------- */
  let mem = null, state = { done: {}, quiz: {}, last: "" };
  const store = {
    load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return mem; } },
    save(s) { mem = s; try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} },
  };
  state = Object.assign(state, store.load() || {});
  let cloud = null;
  const merge = (a, b) => {
    const quiz = { ...a.quiz };
    for (const k in b.quiz || {}) if (!quiz[k] || b.quiz[k].score > quiz[k].score) quiz[k] = b.quiz[k];
    return { done: { ...(b.done || {}), ...a.done }, quiz, last: a.last || b.last || "" };
  };
  const persist = () => { state.updated = Date.now(); store.save(state); if (cloud) cloud.push(state).catch(() => setSync("Sync failed, saved on this device")); };
  const setSync = (t) => ($("#sync").textContent = t);

  async function initCloud() {
    const cfg = window.CM_FIREBASE_CONFIG;
    if (!cfg || !cfg.apiKey) return;
    try {
      const v = "https://www.gstatic.com/firebasejs/10.12.2/";
      const [{ initializeApp }, A, F] = await Promise.all([import(v + "firebase-app.js"), import(v + "firebase-auth.js"), import(v + "firebase-firestore.js")]);
      const app = initializeApp(cfg, M.id), auth = A.getAuth(app), db = F.getFirestore(app);
      const btn = $("#auth"); btn.hidden = false;
      btn.onclick = () => (auth.currentUser ? A.signOut(auth) : A.signInWithPopup(auth, new A.GoogleAuthProvider()).catch(() => {}));
      A.onAuthStateChanged(auth, async (u) => {
        if (!u) { cloud = null; btn.textContent = "Sign in with Google to sync"; $("#who").textContent = ""; setSync("Saved on this device"); return; }
        btn.textContent = "Sign out"; $("#who").textContent = "Signed in as " + (u.displayName || u.email);
        const ref = F.doc(db, "users", u.uid, "courses", M.id);
        cloud = { push: (s) => F.setDoc(ref, { ...s, name: u.displayName || "", email: u.email || "", total, completed: countDone() }, { merge: true }).then(() => setSync("Synced to your account")) };
        try { const snap = await F.getDoc(ref); if (snap.exists()) state = merge(state, snap.data()); persist(); render(); }
        catch { setSync("Sync unavailable, saved on this device"); }
      });
    } catch { /* offline or blocked: stay local */ }
  }

  /* ---------- progress ---------- */
  const passed = (m) => state.quiz[m.id] && state.quiz[m.id].score >= PASS;
  const countDone = () => lessons.filter((l) => state.done[l.id]).length + COURSE.modules.filter(passed).length;
  function paintProgress() {
    const n = countDone(), p = Math.round((n / total) * 100);
    $("#pct").textContent = $("#pct2").textContent = p + "%";
    $("#bar").style.width = $("#bar2").style.width = p + "%";
    $("#count").textContent = n + " of " + total + " done";
  }

  /* ---------- nav ---------- */
  let current = "";
  function paintNav() {
    $("#nav").innerHTML = COURSE.modules.map((m, i) => {
      const d = m.lessons.filter((l) => state.done[l.id]).length + (passed(m) ? 1 : 0);
      return `<h5><span>${i + 1}. ${m.title}</span><span>${d}/${m.lessons.length + 1}</span></h5>` +
        m.lessons.map((l) => `<button data-go="${l.id}" class="${state.done[l.id] ? "done" : ""} ${current === l.id ? "on" : ""}"><span class="dot"></span><span>${l.title}</span></button>`).join("") +
        `<button data-go="quiz-${m.id}" class="quiz ${passed(m) ? "done" : ""} ${current === "quiz-" + m.id ? "on" : ""}"><span class="dot"></span><span>Quiz: ${m.title}${state.quiz[m.id] ? " · " + Math.round(state.quiz[m.id].score * 100) + "%" : ""}</span></button>`;
    }).join("");
  }

  /* ---------- views ---------- */
  const order = COURSE.modules.flatMap((m) => [...m.lessons.map((l) => l.id), "quiz-" + m.id]);
  function home() {
    const n = countDone(), next = order.find((id) => id.startsWith("quiz-") ? !passed(COURSE.modules.find((m) => "quiz-" + m.id === id)) : !state.done[id]);
    const mins = lessons.reduce((a, l) => a + l.mins, 0);
    return `<section class="hero"><div class="eyebrow">${M.eyebrow}</div>
      <h1>${M.h1}</h1>
      <p>${M.intro}</p>
      <div class="cta">${n === total ? `<button class="btn" data-go="finish">View your completion</button>` : `<button class="btn" data-go="${next}">${n ? "Continue where you left off" : "Start lesson 1"}</button>`}
      ${M.downloads.map((d) => `<a class="btn ghost" download="${d.file}" href="${FILES[d.file]}">${d.label}</a>`).join("")}</div>
      <div class="stats"><div><b>${lessons.length}</b><span>lessons</span></div><div><b>${COURSE.modules.length}</b><span>quizzes</span></div><div><b>${M.stat[0]}</b><span>${M.stat[1]}</span></div><div><b>~${Math.round(mins / 60 * 2) / 2}h</b><span>total time</span></div></div></section>
      <h2>The path</h2><div class="mods">${COURSE.modules.map((m, i) => {
        const d = m.lessons.filter((l) => state.done[l.id]).length + (passed(m) ? 1 : 0);
        return `<button class="mod" data-go="${m.lessons[0].id}"><span class="n">${i + 1}</span><span><h4>${m.title}</h4><p>${m.blurb}</p></span><span class="pc">${d}/${m.lessons.length + 1}</span></button>`; }).join("")}</div>
      <p class="small" style="margin-top:28px">Screens and prices checked ${COURSE.checked}. Cursor changes often, so labels may move. This is an independent course and is not affiliated with Cursor.</p>${M.footer || ""}`;
  }
  function lessonView(l) {
    const i = order.indexOf(l.id), prev = order[i - 1], next = order[i + 1], mi = COURSE.modules.indexOf(l.mod);
    return `<div class="eyebrow">Module ${mi + 1} · ${l.mod.title}</div><h1>${l.title}</h1>
      <div class="meta"><span>Lesson ${lessons.indexOf(lessons.find((x) => x.id === l.id)) + 1} of ${lessons.length}</span><span>About ${l.mins} min</span></div>
      ${l.body}
      <div class="foot">${prev ? `<button class="btn ghost" data-go="${prev}">&larr; Back</button>` : "<span></span>"}
      <span style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost done-btn ${state.done[l.id] ? "is" : ""}" data-done="${l.id}">${state.done[l.id] ? "✓ Completed" : "Mark complete"}</button>
      <button class="btn" data-done="${l.id}" data-go="${next}">${next.startsWith("quiz") ? "Complete and take the quiz" : "Complete and continue"} &rarr;</button></span></div>`;
  }
  function quizView(m) {
    const best = state.quiz[m.id];
    return `<div class="eyebrow">Module ${COURSE.modules.indexOf(m) + 1} quiz</div><h1>${m.title}</h1>
      <div class="meta"><span>${m.quiz.length} questions</span><span>${Math.round(PASS * 100)}% to pass</span>${best ? `<span>Best score ${Math.round(best.score * 100)}%</span>` : ""}</div>
      <form id="quiz">${m.quiz.map((q, i) => `<div class="q"><h4>${i + 1}. ${q.q}</h4>${q.a.map((a, j) => `<label><input type="radio" name="q${i}" value="${j}" required><span>${a}</span></label>`).join("")}<div class="why">${q.why}</div></div>`).join("")}
      <div class="result" id="result"></div>
      <div class="foot"><button type="button" class="btn ghost" data-go="${m.lessons[m.lessons.length - 1].id}">&larr; Back to lesson</button><button class="btn" id="submit">Check my answers</button></div></form>`;
  }
  function finish() {
    const avg = Math.round(COURSE.modules.reduce((a, m) => a + (state.quiz[m.id] ? state.quiz[m.id].score : 0), 0) / COURSE.modules.length * 100);
    return `<div class="cert"><div class="eyebrow">Masterclass complete</div><h2>You finished ${M.title}.</h2>
      <p>${lessons.length} lessons, ${COURSE.modules.length} quizzes passed, average quiz score ${avg}%.</p>
      <p class="small">Completed ${new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" })}</p>
      <div class="cta" style="justify-content:center"><button class="btn" onclick="print()">Print or save as PDF</button><button class="btn ghost" data-go="">Back to overview</button></div></div>`;
  }

  function render() {
    const l = lessons.find((x) => x.id === current), m = COURSE.modules.find((x) => "quiz-" + x.id === current);
    $("#page").innerHTML = l ? lessonView(l) : m ? quizView(m) : current === "finish" ? finish() : home();
    paintNav(); paintProgress();
  }
  function go(id, scroll = true) {
    current = id || ""; state.last = current; store.save(state);
    try { history.replaceState(null, "", current ? "#" + current : location.pathname + location.search); } catch {}
    render(); $("#side").classList.remove("open"); $("#scrim").classList.remove("open");
    if (scroll) window.scrollTo(0, 0);
  }

  /* ---------- events ---------- */
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-done],[data-go],.copy,.frame");
    if (!t) return;
    if (t.classList.contains("copy")) {
      const txt = t.closest(".prompt").querySelector("pre").textContent;
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => (t.textContent = "Copied"), () => (t.textContent = "Select and copy"));
      setTimeout(() => (t.textContent = "Copy"), 1600); return;
    }
    if (t.classList.contains("frame")) { $("#lb img").src = t.querySelector("img").src; $("#lb").classList.add("show"); return; }
    if (t.dataset.done) {
      const id = t.dataset.done, advancing = "go" in t.dataset;
      if (advancing || !state.done[id]) state.done[id] = Date.now(); else delete state.done[id];
      persist(); if (!advancing) return render();
    }
    if ("go" in t.dataset) go(t.dataset.go);
  });
  document.addEventListener("submit", (e) => {
    if (e.target.id !== "quiz") return;
    e.preventDefault();
    const m = COURSE.modules.find((x) => "quiz-" + x.id === current); let right = 0;
    e.target.querySelectorAll(".q").forEach((box, i) => {
      const pick = +new FormData(e.target).get("q" + i); box.classList.add("graded");
      box.querySelectorAll("label").forEach((lab, j) => { lab.classList.remove("right", "wrong"); if (j === m.quiz[i].c) lab.classList.add("right"); else if (j === pick) lab.classList.add("wrong"); });
      if (pick === m.quiz[i].c) right++;
    });
    const score = right / m.quiz.length, prev = state.quiz[m.id];
    if (!prev || score > prev.score) state.quiz[m.id] = { score, at: Date.now() };
    state.quiz[m.id].tries = ((prev && prev.tries) || 0) + 1; persist(); paintNav(); paintProgress();
    const r = $("#result"), ok = score >= PASS, i = COURSE.modules.indexOf(m), nextM = COURSE.modules[i + 1], all = countDone() === total;
    r.className = "result show" + (ok ? "" : " fail");
    r.innerHTML = `<b>${right} of ${m.quiz.length} correct</b><p>${ok ? "Passed. Review the explanations above, then keep going." : "Not quite. Read the explanations above and try again. You need " + Math.round(PASS * 100) + "%."}</p>` +
      (ok ? `<button type="button" class="btn" data-go="${all ? "finish" : nextM ? nextM.lessons[0].id : ""}">${all ? "See your completion" : nextM ? "Start module " + (i + 2) : "Back to overview"} &rarr;</button>` : `<button type="button" class="btn" data-go="${current}">Try again</button>`);
    r.scrollIntoView({ block: "center", behavior: "smooth" });
  });
  $("#lb").onclick = () => $("#lb").classList.remove("show");
  document.addEventListener("keydown", (e) => e.key === "Escape" && $("#lb").classList.remove("show"));
  $("#home").onclick = () => go("");
  $("#menu").onclick = $("#scrim").onclick = () => { $("#side").classList.toggle("open"); $("#scrim").classList.toggle("open"); };
  $("#theme").onclick = () => {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem(KEY + "-theme", document.documentElement.dataset.theme); } catch {}
  };
  let armed = 0;
  $("#reset").onclick = (e) => {
    if (Date.now() - armed > 4000) { armed = Date.now(); e.target.textContent = "Click again to confirm reset"; setTimeout(() => (e.target.textContent = "Reset my progress"), 4000); return; }
    state = { done: {}, quiz: {}, last: "" }; persist(); e.target.textContent = "Reset my progress"; go("");
  };
  try { const t = localStorage.getItem(KEY + "-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  const h = location.hash.slice(1);
  current = order.includes(h) || h === "finish" ? h : "";
  render(); initCloud();
})();
</script>
</body>
